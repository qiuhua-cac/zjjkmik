        { id:92, type:'multiple', text:'《公民道德建设实施纲要》明确提出，（ABCDE）是从业人员职业道德规范的主要内容？', options:['爱岗敬业','诚实守信','办事公道','热情服务','奉献社会'], answer:[0,1,2,3,4], explanation:'爱岗敬业、诚实守信、办事公道、热情服务、奉献社会是从业人员职业道德规范的主要内容。' },
        { id:93, type:'multiple', text:'（ABE）是选用隔绝助燃物进行防火的有效措施？', options:['密闭有可燃物质的容器','隔离与酸等接触能燃烧爆炸的可燃物和还原剂','防止撞击火爆','将可燃物与化学性质相抵触的其他物品隔离分开保存，并防止"跑、冒、滴、漏"等','充装惰性气体储运有爆炸危险物品的容器'], answer:[0,1,4], explanation:'密闭有可燃物质的容器、隔离与酸等接触能燃烧爆炸的可燃物和还原剂、充装惰性气体储运有爆炸危险物品的容器是选用隔绝助燃物的有效措施。' },
        { id:94, type:'multiple', text:'泡沫灭火剂的灭火原理是（BCDE）？', options:['中和','窒息','隔离','淹没','冷却'], answer:[1,2,3,4], explanation:'泡沫灭火剂通过冷却、窒息、隔离、淹没等综合作用实现灭火。' },
        { id:95, type:'multiple', text:'自动喷水灭火系统具有自动（BCD）的良好性能，是目前使用范围最广、用量最多、造价相对低廉的自动灭火系统？', options:['洒水','探测火灾','报警','启动喷水控（灭）火','供水'], answer:[1,2,3], explanation:'自动喷水灭火系统具有自动探测火灾、报警、启动喷水控（灭）火的良好性能。' },
        { id:96, type:'multiple', text:'火灾报警控制器按应用方式包括（ABCE）？', options:['独立型火灾报警控制器','区域型火灾报警控制器','集中型火灾报警控制器','非集中型火灾报警控制器','集中区域兼容型火灾报警控制器'], answer:[0,1,2,4], explanation:'火灾报警控制器按应用方式分类有：独立型、区域型、集中型、集中区域兼容型火灾报警控制器。' },
        { id:97, type:'multiple', text:'下列属于老年人照料设施的是（ABC）？', options:['养老院','托老所','老年人日间照料中心','老年人活动中心','老年人大学'], answer:[0,1,2], explanation:'属于老年人照料设施的是：养老院、托老所、老年人日间照料中心。' },
        { id:98, type:'multiple', text:'检查消防应急广播设备的主机外壳，确保消防应急广播设备的（ABD）？', options:['产品标识清晰明显','机壳表面清洁','涂覆层脱落和起泡现象','无腐蚀现象','产品标识破损或脱落'], answer:[0,1,3], explanation:'确保产品标识清晰明显，机壳表面清洁，无腐蚀、涂覆层无脱落和起泡现象。' },
        { id:99, type:'multiple', text:'（AE）+（）键可以切换窗口？', options:['alt','ctrl','Fn','Shift','Tab'], answer:[0,4], explanation:'alt+Tab键可以切换窗口。' },
        { id:100, type:'multiple', text:'《中华人民共和国消防法》规定（ABDE）的消防工作，由其主管单位监督管理？', options:['军事设施','核电厂','森林','矿井地下部分','海上石油天然气'], answer:[0,1,3,4], explanation:'军事设施、矿井地下部分、核电厂、海上石油天然气设施的消防工作，由其主管单位监督管理。' },
        { id:101, type:'multiple', text:'消防工作具有广泛的社会性，要真正在全社会做到预防火灾发生，减少火灾危害，必须（ABCDE），实行全民消防？', options:['政府统一领导','部门依法监管','单位全面负责','公民积极参与','社会各界力量和全体公民共同参与'], answer:[0,1,2,3,4], explanation:'必须按照政府统一领导、部门依法监管、单位全面负责、公民积极参与的原则，依靠社会各界的力量和全体公民共同参与，实行群防群治。' },
        { id:102, type:'multiple', text:'我国将低压供配电系统按接地形式分为（ACD）？', options:['IT系统','II系统','TT系统','TN系统','NN系统'], answer:[0,2,3], explanation:'将低压供配电系统按接地形式分为TT、TN和IT三种。' },
        { id:103, type:'multiple', text:'（ADE）等空间宜采用机械加压送风方式阻止火灾烟气侵入？', options:['楼梯间','房间','走廊','前室','避难层（间）'], answer:[0,3,4], explanation:'防烟系统是通过采用机械加压送风方式阻止火灾烟气侵入楼梯间、前室、避难层（间）等空间的系统。' },
        { id:104, type:'multiple', text:'建筑高度大于50m的公共建筑、工业建筑和建筑高度大于100m的住宅建筑，其（ABCDE）等部位应采用机械加压送风系统？', options:['防烟楼梯间','独立前室','合用前室','消防电梯前室','共用前室'], answer:[0,1,2,3,4], explanation:'其防烟楼梯间、消防电梯前室、独立前室、合用前室和共用前室等部位应采用机械加压送风系统。' },
        { id:105, type:'multiple', text:'消防水泵包括（ABC）？', options:['固定消防水泵','消防车消防水泵','移动消防水泵','高位消防水箱消防水泵','应急消防水泵'], answer:[0,1,2], explanation:'消防水泵包括固定消防水泵、移动消防水泵和消防车消防水泵。' },
        { id:106, type:'multiple', text:'下列关于避难间设置要求说法正确的是（ABCDE）？', options:['避难区的净面积应满足避难间所在区域设计避难人数的要求','避难间应靠近疏散楼梯间，不应在可燃物库房、锅炉房、发电机房、变配电站等火灾危险性大的场所的正下方、正上方或贴邻','避难间应采用耐火极限不低于2.0h的防火隔墙和甲级防火门与其他部位分隔','避难间应采取防止火灾烟气进入或积聚的措施，并应设置可开启外窗，除外窗和疏散门外，避难间不应设置其他开口','避难间内应设置消防软管卷盘、灭火器、消防专线电话和应急广播'], answer:[0,1,2,3,4], explanation:'以上均正确。' },
        { id:107, type:'multiple', text:'通过可燃气体报警控制器报警信息确定报警类别和部位，下列说法正确的是（ABCDE）？', options:['可以通过报警声音对报警类别进行判断','可以通过面板专用指示灯对报警类别进行判断','可以查看液晶显示屏显示内容确定可燃气体报警部位、报警时间、设备类型相关信息','可以通过液晶显示屏显示内容查看故障的时间、类型和位置等信息','可以通过查看系统设备编码与保护场所（房间）对照表资料，确定报警部位'], answer:[0,1,2,3,4], explanation:'以上说法均正确。' },
        { id:108, type:'multiple', text:'室外消火栓给水系统按用途不同可分为（ABCD）？', options:['生产、生活、消防合用给水系统','生产、消防合用给水系统','生活、消防合用给水系统','独立的消防给水系统','非独立的消防水源给水系统'], answer:[0,1,2,3], explanation:'按用途不同可分为生产、生活、消防合用给水系统；生产、消防合用给水系统；生活、消防合用给水系统；独立的消防给水系统四类。' },
        { id:109, type:'multiple', text:'（AB）属于建筑物？', options:['学校','商店','桥梁','堤坝','水塔'], answer:[0,1], explanation:'学校、商店属于建筑物；桥梁、堤坝、水塔属于构筑物。' },
        { id:110, type:'multiple', text:'《消防给水及消火栓系统技术规范》（GB50974-2014）主要内容包括（ABCDE）？', options:['消防水源','供水设施','给水形式','消火栓系统','系统调试与验收'], answer:[0,1,2,3,4], explanation:'主要内容包括消防水源、供水设施、给水形式、消火栓系统、系统调试与验收等。' },
        { id:111, type:'multiple', text:'下列属于文件（夹）的基本操作的是（ABCDE）？', options:['建立文件夹','重命名文件（夹）','选中文件（夹）','复制、移动、剪切文件（夹）','删除文件（夹）'], answer:[0,1,2,3,4], explanation:'文件（夹）的基本操作有：建立文件夹、重命名、选中、复制移动剪切、删除。' },
        { id:112, type:'multiple', text:'组成区域报警系统的组件主要有（ABCE）？', options:['火灾探测器','手动火灾报警按钮','火灾声光警报器','消防联动控制器','火灾报警控制器'], answer:[0,1,2,4], explanation:'区域报警系统的组件：火灾探测器、手动火灾报警按钮、火灾声光警报器、火灾报警控制器。' },
        { id:113, type:'multiple', text:'加强公民道德建设有（ABDE）4个着力点？', options:['社会公德','职业道德','中华传统美德','家庭美德','个人品德'], answer:[0,1,3,4], explanation:'加强公民道德建设有社会公德、职业道德、家庭美德、个人品德4个着力点。' },
        { id:114, type:'multiple', text:'惰性气体灭火剂可以扑救（ABCDE）？', options:['救灭火前可切断气源的气体火灾','液体火灾','石蜡、沥青等可熔化的固体火灾','成卷装或堆垛类的棉毛、织物、纸张等部分固体深位火灾','电气火灾'], answer:[0,1,2,3,4], explanation:'惰性气体灭火剂可以扑救以上各类火灾。' },
        { id:115, type:'multiple', text:'热对流只能发生在流体（气体和液体中），是指流体中质点发生相对位移而引起的、由空间的一处向另一处传播热能的现象，热对流分为以下几种（AC）？', options:['气体对流','固体传导','液体对流','强制对流','自然对流'], answer:[0,2], explanation:'热对流分为气体对流和液体对流。' },
        { id:116, type:'multiple', text:'消除静电危害的措施主要有（ABCDE）？', options:['接地法','泄露法','中和法','工艺控制法','导除法'], answer:[0,1,2,3,4], explanation:'消除静电危害的措施主要有：接地法、泄漏法、中和法、工艺控制法和导除法。' },
        { id:117, type:'multiple', text:'消防水源包括（ABCD）？', options:['市政给水','消防水池','高位消防水池','天然水源','消防水泵接合器'], answer:[0,1,2,3], explanation:'消防水源包括市政给水、消防水池、高位消防水池和天然水源等。' },
        { id:118, type:'judge', text:'剩余电流式电气火灾监控探测器在供电线路泄漏电流大于500mA时，宜设置在其下一级配电柜（箱）。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:119, type:'judge', text:'消防电话总机能为消防电话分机供电，能与消防电话分机进行半双工通话。（错）', options:['对','错'], answer:1, explanation:'消防电话总机能为消防电话分机和消防电话插孔供电，能与消防电话分机进行全双工通话。' },
        { id:120, type:'judge', text:'气体灭火系统按照应用方式分为组合分配和单元独立。（错）', options:['对','错'], answer:1, explanation:'气体灭火系统按应用方式分为全淹没和局部应用灭火系统。' },
        { id:121, type:'judge', text:'蛋白泡沫灭火剂可以用于液下喷射灭火，也能与干粉灭火剂联用。（错）', options:['对','错'], answer:1, explanation:'蛋白泡沫灭火剂不可以用于液下喷射灭火，也不能与干粉灭火剂联用。' },
        { id:122, type:'judge', text:'A类火灾是指气体火灾。（错）', options:['对','错'], answer:1, explanation:'A类火灾是指固体物质火灾。' },
        { id:123, type:'judge', text:'可燃气体报警控制器在接收到可燃气体探测器的可燃气体浓度参数信息或报警信息后，经报警确认判断，显示可燃气体探测器的位置并发出泄露的可燃气体深度参数信息，记录可燃气体探测器的报警时间，同时驱动安装在保护区域现场的声光警报装置，发出声光警报，警示人员采取相应的处置措施。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:124, type:'judge', text:'听到报警声信号后，注意观察集中控制器面板上的各指示灯信息，发现某一专用的总指示灯点亮，即可判断集中控制器发出了对应类型的报警信号。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:125, type:'judge', text:'报警阀组是使水能够自动单方向流入喷水系统配水管道同时进行报警的阀组。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:126, type:'judge', text:'快速排气装置可以快速排除系统管网中的气体，使干式报警阀尽快动作，水源快速进入供水管网喷水灭火。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:127, type:'judge', text:'目前很多集中控制器与消防专用电话总机、消防应急广播控制装置等消防联动控制设备设计在同一箱体内。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:128, type:'judge', text:'除疏散门外，楼梯周围2m内的墙面上不应设置其他开口，疏散门可以正对梯段。（错）', options:['对','错'], answer:1, explanation:'疏散门不应正对梯段。' },
        { id:129, type:'judge', text:'当建筑梁超过50cm时，该横梁可以作为档烟设施使用。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:130, type:'judge', text:'消防水泵控制柜应采取防止被水淹没的措施。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:131, type:'judge', text:'消防水池容积越大，供水可靠性越强。（错）', options:['对','错'], answer:1, explanation:'消防水池容积过大也会影响供水的可靠性。' },
        { id:132, type:'judge', text:'火灾发生时应能在消控室将火灾疏散层的扬声器和公共广播录音机强制转入消防应急广播状态。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:133, type:'judge', text:'在避难层进入楼梯间的入口处和疏散楼梯通向避难层的出口处，均应在明显位置设置标识避难层和楼层位置的灯光指示标志。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:134, type:'judge', text:'排烟风机一般设置在排烟系统的最低处，且风机应设置在专用机房内。（错）', options:['对','错'], answer:1, explanation:'排烟风机一般设置在机械排烟系统的最高处。' },
        { id:135, type:'judge', text:'可燃气体报警控制器可以只有低限报警功能。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:136, type:'judge', text:'电压不但有大小而且有方向。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:137, type:'judge', text:'接收到监管报警信号后，集中控制器的声信号与火灾报警声信号有区别，通常可独立设置监管声报警类型（一般采用警车警报器音调），不可选用故障声报警类型。（错）', options:['对','错'], answer:1, explanation:'也可选用故障声报警类型。' },
        { id:138, type:'judge', text:'玻璃球喷头的工作液色标为黄色其温度是78℃。（错）', options:['对','错'], answer:1, explanation:'黄色为79℃。' },
        { id:139, type:'judge', text:'电气控制柜应具备双电源自动切换功能。当消防主电源故障时应能自动切换至备用电源继续供电。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:140, type:'judge', text:'水灭火时覆盖隔离发挥着主要作用。（错）', options:['对','错'], answer:1, explanation:'水灭火的主要原理是冷却。' },
        { id:141, type:'judge', text:'当发生故障时，消防联动控制器应发出与火灾报警信号有明显区别的故障声、光信号。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:142, type:'judge', text:'消防电话总机有录音功能，进行通话时，录音自动开始，并有光信号指示，通话结束，录音自动停止。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:143, type:'judge', text:'细水雾灭火系统按其应用方式分为瓶组式、泵组式及其他供水方式细水雾灭火系统。（错）', options:['对','错'], answer:1, explanation:'细水雾灭火系统按应用方式分为全淹没细水喷雾系统和局部应用细水喷雾系统。' },
        { id:144, type:'judge', text:'蓄电池只能进行一次放电操作，放电后电池无法再次充电的电池，又称一次电池。（错）', options:['对','错'], answer:1, explanation:'原电池是一次电池，蓄电池是二次电池。' },
        { id:145, type:'judge', text:'检查消防泵组电气控制柜的供电和各项切换功能，且转换开关应处于"自动"状态。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:146, type:'judge', text:'消防电话总机能终止与任意消防电话分机的通话，与其他消防电话分机的通话同时终止。（错）', options:['对','错'], answer:1, explanation:'不影响与其他消防电话分机的通话。' },
        { id:147, type:'judge', text:'当老年人公共活动用房、康复与医疗用房布置在半地下或地下一层、地上四层及以上楼层时，每个房间的建筑面积不应大于200平方米且使用人数不应大于30人。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:148, type:'judge', text:'在消防控制室外增设的区域控制器可采用手动方式控制消防联动设备，且所有信息均应传送至集中控制器。（错）', options:['对','错'], answer:1, explanation:'在消防控制室外增设的区域控制器均不应采用手动方式控制消防联动设备。' },
        { id:149, type:'judge', text:'25m高藏书超过100万册的图书馆属于一类高层。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:150, type:'judge', text:'烟囱属于建筑物。（错）', options:['对','错'], answer:1, explanation:'烟囱属于构筑物。' },
        { id:151, type:'judge', text:'在供电线路泄漏电流大于500mA时，剩余电流式电气火灾监控探测器宜在第一级配电柜（箱）设置。（错）', options:['对','错'], answer:1, explanation:'宜在其下一级配电柜（箱）设置。' },
        { id:152, type:'judge', text:'火灾探测报警产品实施保养后，应按规定填写"建筑消防设施故障维修记录表"。（错）', options:['对','错'], answer:1, explanation:'应填写"建筑消防设施维护保养记录表"。' },
        { id:153, type:'judge', text:'超过3kW的固定式电热器距周围0.5m以内不应放置可燃物，低于3kW的可移动式电热器具与周围可燃物应保持0.3m以上的距离。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:154, type:'judge', text:'实施主/备电切换时，双电源转换开关应处于自动控制状态，测试完成后恢复手动控制。（错）', options:['对','错'], answer:1, explanation:'测试完成后仍保持自动控制状态。' },
        { id:155, type:'judge', text:'老年人照料设施的居室和休息室不应布置在地下或半地下。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:156, type:'judge', text:'个人有占用、堵塞、封闭疏散通道、安全出口或者有其他妨碍安全疏散行为的，处警告或者500元以下罚款。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:157, type:'judge', text:'建筑高度为30m的住宅楼应设置灯光疏散指示标志。（对）', options:['对','错'], answer:0, explanation:'建筑高度大于27m的住宅建筑应设置灯光疏散指示标志。' },
        { id:158, type:'judge', text:'现场消防设备工作状态可通过查询功能、检查功能或联动控制信号等三种方式进行判别。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:159, type:'judge', text:'气体灭火系统适用于扑救电气火灾。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:160, type:'judge', text:'《气体灭火系统设计规范》（GB50370-2005）主要内容包括总则、术语和符号、设计要求、系统组件、操作与控制、安全要求等。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:161, type:'judge', text:'火灾显示盘交流供电型是由交流电源供电，具有主／备电自动转换、备用电源自动充电、电源故障监测和电源工作状态指示等功能。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:162, type:'judge', text:'建筑高度大于32m的二类高层公共建筑应设置消防电梯。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:163, type:'judge', text:'医院中的住院病房可以布置在地下或者半地下。（错）', options:['对','错'], answer:1, explanation:'医院中的住院病房不可以布置在地下或者半地下。' },
        { id:164, type:'judge', text:'对送风机的末端配电装置保养时，如发现线路接头处有氧化、锈蚀痕迹，应采取镀锡和涂抹凡士林等防潮、防锈措施。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:165, type:'judge', text:'当电气火灾监控设备发出消防车警报声，则电气火灾监控系统处于监控报警状态。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:166, type:'judge', text:'对于消防电梯，为方便火灾时消防人员接近和快速使用，其迫降要求是使电梯返回到指定层（一般为首层）并保持"开门停用"的状态。（错）', options:['对','错'], answer:1, explanation:'应保持"开门待用"的状态。' },
        { id:167, type:'judge', text:'消防电话总机保养时不需要断开相关电源。（错）', options:['对','错'], answer:1, explanation:'接线检查应在消防电话总机断电状态下进行。' },
        { id:168, type:'judge', text:'疏散楼梯间及其前室与其他部位的防火分隔不应使用卷帘。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:169, type:'judge', text:'当系统在消防控制室外设置有区域控制器时，应在消防控制室查看集中控制器是否存在接收和显示来自相关区域控制器的电源故障报警完整信息。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:170, type:'judge', text:'消防水池的通气管、呼吸管和溢流水管等应采取防止虫鼠等进入消防水池的技术措施，确保消防水池内的水不受污染、不堵塞消防给水管道。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:171, type:'judge', text:'消防联动控制器是火灾自动报警系统中用于接收、显示和传递火灾报警信号，发出控制信号，并具有其他辅助功能的控制指示设备。（错）', options:['对','错'], answer:1, explanation:'集中火灾报警控制器才是用于接收、显示和传递火灾报警信号。' },
        { id:172, type:'judge', text:'集中报警系统适用于不仅需要报警，同时需要联动自动消防设备，且只设置一台具有集中控制功能的火灾报警控制器和消防联动控制器的保护对象。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:173, type:'judge', text:'消防设施操作员是为水平评价类职业资格。（错）', options:['对','错'], answer:1, explanation:'消防设施操作员为准入类职业资格。' },
        { id:174, type:'judge', text:'固体之间热量可以通过热对流传导。（错）', options:['对','错'], answer:1, explanation:'热对流只能发生在流体中。' },
        { id:175, type:'judge', text:'消防水泵房的室内环境温度不应低于5℃。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:176, type:'judge', text:'当建筑内梁突出顶棚的高度超过0.6m时，被梁隔断的每个梁间区域应至少设置一只探测器。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:177, type:'judge', text:'《固定消防炮灭火系统施工与验收规范》（GB50498-2009）适用于新建、扩建、改建工程中设置固定消防炮灭火系统的施工、验收及维护管理。（对）', options:['对','错'], answer:0, explanation:'表述正确。' }
      ]
    },
    {
      id: 'paper3',
      name: '中级监控精准题库03',
      description: '单选题 81 题 · 多选题 36 题 · 判断题 48 题',
      questions: [
        { id:1, type:'single', text:'判断消防供水设施的工作状态，应检查消防泵组电气控制柜的供电和各项切换功能，且转换开关应处于（A）状态。', options:['自动','手动','自动允许','手动允许'], answer:0, explanation:'转换开关应处于"自动"状态。' },
        { id:2, type:'single', text:'可燃气体报警控制器液晶显示器不能全部显示当前状态的报警信息时，可通过键盘区（C）的手动操作查询未显示的报警信息。', options:['功能键','数字键','方向键','F3键'], answer:2, explanation:'可通过键盘区方向键的手动操作查询。' },
        { id:3, type:'single', text:'"公民积极参与"是做好消防工作的（D）。', options:['核心','关键','根本','基础'], answer:3, explanation:'公民积极参与是做好消防工作的基础。' },
        { id:4, type:'single', text:'（B）是指响应异常温度、温升速率和温差变化等参数的探测器。', options:['火焰探测器','感温火灾探测器','感烟火灾探测器','气体火灾探测器'], answer:1, explanation:'感温火灾探测器是响应异常温度、温升速率和温差变化等参数的探测器。' },
        { id:5, type:'single', text:'（A）是从业人员在职业活动中必须遵守的符合人民根本利益的职业行为准则。', options:['职业道德行为规范','职业道德','职业规范','职业准则'], answer:0, explanation:'职业道德行为规范是从业人员在职业活动中必须遵守的符合人民根本利益的职业行为准则。' },
        { id:6, type:'single', text:'（C）不具备直接灭火的能力，主要用于火灾发生时阻隔火势蔓延及热扩散。', options:['干式系统','湿式系统','水幕系统','雨淋系流'], answer:2, explanation:'水幕系统不具备直接灭火的能力，主要用于火灾发生时阻隔火势蔓延及热扩散。' },
        { id:7, type:'single', text:'在高温潮湿环境下，消防水泵控制柜内应设置自动（C）的装置。', options:['防潮','除湿','防潮除湿','烘干'], answer:2, explanation:'应设置自动防潮除湿的装置。' },
        { id:8, type:'single', text:'（C）肩负着探测火灾早期特征、发出火灾报警信号，为人员疏散、防止火灾蔓延和启动自动灭火设施提供控制和指示。', options:['火灾探测报警系统','火灾预警系统','火灾自动报警系统','消防联动控制系统'], answer:2, explanation:'火灾自动报警系统肩负着探测火灾早期特征、发出火灾报警信号。' },
        { id:9, type:'single', text:'玻璃球喷头的工作液色标为黄色，其温度是（D）？', options:['63℃','69℃','73℃','79℃'], answer:3, explanation:'黄色为79℃。' },
        { id:10, type:'single', text:'对集中火灾报警控制器、消防联动控制器、消防控制室图形显示装置的开关按键、键盘鼠标的保养方法中正确是（C）。', options:['发现油漆脱落应及时涂补','用清洁剂擦拭表面，确保干净清洁','用小毛刷将孔隙内的灰尘和杂质清扫出来，再用吸尘器清理干净','发现标注的文字、标签脱落可暂缓修复'], answer:2, explanation:'用小毛刷将孔隙内的灰尘和杂质清扫出来，再用吸尘器清理干净。' },
        { id:11, type:'single', text:'下列不属于线型感烟探测器使用范围的是（A）。', options:['产生油雾和蒸汽的场所','飞机库','博物馆','商场'], answer:0, explanation:'产生油雾和蒸汽的场所不宜选择线型光束感烟火灾探测器。' },
        { id:12, type:'single', text:'（A）是用于监视防火门的开闭状态，并能将其状态信息反馈至防火门监控器的装置。', options:['防火门门磁开关','防火门电动闭门器','防火门电磁释放器','防火门监控器'], answer:0, explanation:'防火门门磁开关是用于监视防火门的开闭状态的装置。' },
        { id:13, type:'single', text:'（C）是评定液体火灾危险性大小的重要参数。', options:['燃点','自燃点','闪点','凝固点'], answer:2, explanation:'闪点是评定液体火灾危险性大小的重要参数。' },
        { id:14, type:'single', text:'（B）是电气火灾监控系统的核心控制单元。', options:['电流互感器','电气火灾监控设备','图形显示装置','电气火灾探测器'], answer:1, explanation:'电气火灾监控设备是电气火灾监控系统的核心控制单元。' },
        { id:15, type:'single', text:'（D）是火灾情况下用于通告火灾报警信息、发出人员疏散语音指示及发生其他灾害与突发事件时发布有关指令的系统。', options:['火灾自动报警系统','消防联动控制系统','消防电话系统','消防应急广播系统'], answer:3, explanation:'消防应急广播系统是火灾情况下用于通告火灾报警信息、发出人员疏散语音指示的系统。' },
        { id:16, type:'single', text:'对于预作用自动喷水灭火系统来说，在选择洒水喷头时应选择（D）洒水喷头。', options:['下垂型','边墙型','吊顶型','直立型'], answer:3, explanation:'应选择直立型洒水喷头。' },
        { id:17, type:'single', text:'《消防法》明确规定：矿井地下部分、核电厂、海上石油天然气设施的消防工作，由（C）监督管理。', options:['县级以上人民政府','县级以上人民政府应急管理机构','主管单位','消防救援机构'], answer:2, explanation:'由其主管单位监督管理。' },
        { id:18, type:'single', text:'（C）主要用于实时监控和反馈防火门的工作状态，接收控制指令后控制常开防火门关闭，一般安装在防火门附近。', options:['防火门门磁开关','防火门电动闭门器','防火门监控模块','防火门监控器'], answer:2, explanation:'防火门监控模块主要用于实时监控和反馈防火门的工作状态。' },
        { id:19, type:'single', text:'（A）是指响应火焰发出的特定波段电磁辐射的探测器。', options:['感光火灾探测器','感温火灾探测器','感烟火灾探测器','线型火灾探测器'], answer:0, explanation:'感光火灾探测器是指响应火焰发出的特定波段电磁辐射的探测器。' },
        { id:20, type:'single', text:'凡使物质开始燃烧的外部热源，称为（A）。', options:['引火源','可燃物','点火源','火源'], answer:0, explanation:'凡使物质开始燃烧的外部热源，称为引火源。' },
        { id:21, type:'single', text:'固体可燃物由于其分子结构的复杂性，物理性质的不同，其燃烧方式也不同，有蒸发燃烧、分解燃烧、表面燃烧和（D）四种。', options:['动力燃烧','扩散燃烧','着火','阴燃'], answer:3, explanation:'有蒸发燃烧、分解燃烧、表面燃烧和阴燃四种。' },
        { id:22, type:'single', text:'（B）火灾探测器由敏感部件和与其相连接的信号处理单元及终端组成。', options:['线型光束感烟','线型感温','点型感烟','点型感温'], answer:1, explanation:'线型感温火灾探测器由敏感部件和与其相连接的信号处理单元及终端组成。' },
        { id:23, type:'single', text:'（B）是火灾自动报警系统中用于接收、显示和传递火灾报警信号，发出控制信号，并具有其他辅助功能的控制指示设备。', options:['区域火灾报警控制器','集中火灾报警控制器','火灾显示盘','家用火灾报警控制器'], answer:1, explanation:'集中火灾报警控制器是火灾自动报警系统中用于接收、显示和传递火灾报警信号的控制指示设备。' },
        { id:24, type:'single', text:'（A）是指在建筑内部采用防火墙、耐火楼板等设施分隔而成，能在一定时间内防止火灾向同一建筑的其余部分蔓延的局部空间。', options:['防火分区','防烟分区','疏散走道','避难层'], answer:0, explanation:'防火分区是指在建筑内部采用防火墙、耐火楼板等设施分隔而成的局部空间。' },
        { id:25, type:'single', text:'（C）是使常开防火门保持打开状态，在收到指令后释放防火门使其关闭，并将本身的状态信息反馈至防火门监控器的电动装置。', options:['防火门门磁开关','防火门电动闭门器','防火门电磁释放器','防火门监控器'], answer:2, explanation:'防火门电磁释放器是使常开防火门保持打开状态的电动装置。' },
        { id:26, type:'single', text:'防火门监控器应在电动闭门器、电磁释放器或门磁开关动作后（C）s内收到反馈信号，并有反馈光指示，指示其名称或部位，反馈光指示应保持至受控设备恢复。', options:['15','30','10','20'], answer:2, explanation:'应在10s内收到反馈信号。' },
        { id:27, type:'single', text:'（A）是物质从一种状态迅速转变成另一状态，并在瞬间放出大量能量，同时产生声响的现象。', options:['爆炸','闪燃','自燃','着火'], answer:0, explanation:'爆炸是物质从一种状态迅速转变成另一状态，并在瞬间放出大量能量，同时产生声响的现象。' },
        { id:28, type:'single', text:'（B）是指由梁和柱以钢接或铰接相连接成承重体系的房屋建筑结构。', options:['砌体结构','框架结构','剪力结构','特种结构'], answer:1, explanation:'框架结构是指由梁和柱以钢接或铰接相连接成承重体系的房屋建筑结构。' },
        { id:29, type:'single', text:'防火隔间的门应采用（A）防火门。', options:['甲级','乙级','丙级','普通门'], answer:0, explanation:'防火隔间的门应采用甲级防火门。' },
        { id:30, type:'single', text:'（D）属于不低于二级耐火等级建筑。', options:['建筑高度小于27m的住宅','木柱承重的建筑','木结构屋顶的砖木结构建筑','建筑高度大于27m且不大于54m的住宅'], answer:3, explanation:'建筑高度大于27m且不大于54m的住宅属于不低于二级耐火等级建筑。' },
        { id:31, type:'single', text:'（A）是道德体系中一个重要的组成部分，它是指从事一定职业劳动的人们，在特定的工作和劳动中以其内心信念和特殊社会手段来维系的，以善恶进行评价的心理意识、行为原则和行为规范的总和。', options:['职业道德','职业作风','职业资格','职业荣誉'], answer:0, explanation:'职业道德是道德体系中一个重要的组成部分。' },
        { id:32, type:'single', text:'（A）是指建筑高度大于27m的住宅和建筑高度大于24m的非单层建筑。', options:['高层建筑','单层建筑','多层','公共建筑'], answer:0, explanation:'高层建筑是指建筑高度大于27m的住宅和建筑高度大于24m的非单层建筑。' },
        { id:33, type:'single', text:'防雷电感应接地干线与接地装置的连接不得少于（C）处。', options:['4','3','2','1'], answer:2, explanation:'不得少于2处。' },
        { id:34, type:'single', text:'防火卷帘温控释放装置的感温元件周围的温度达到（B）±0.5℃时，温控释放装置动作，牵引开启卷门机的制动机构，卷帘依靠自重下降关闭。', options:['68','73','57','93'], answer:1, explanation:'温度达到73±0.5℃时动作。' },
        { id:35, type:'single', text:'在供电线路泄漏电流（B）时，剩余电流监控探测器宜在下一级配电柜（箱）设置。', options:['小于500mA','大于500mA','大于100mA','小于100mA'], answer:1, explanation:'泄漏电流大于500mA时宜在下一级配电柜（箱）设置。' },
        { id:36, type:'single', text:'凡是能与空气中氧或其他氧化剂起燃烧化学反应的物质称为（A）。', options:['可燃物','助燃物','氧化物','导热体'], answer:0, explanation:'称为可燃物。' },
        { id:37, type:'single', text:'发生火灾时由火灾自动报警系统或传动管控制，自动开启报警阀组和启动消防水泵的系统是（D）。', options:['湿式系统','干式系统','预作用系统','雨淋系统'], answer:3, explanation:'雨淋系统发生火灾时由火灾自动报警系统或传动管控制。' },
        { id:38, type:'single', text:'（B）应急照明和疏散指示系统由自带电源型消防应急灯具，应急照明配电箱及相关附件等组成。', options:['自带电源集中控制型','自带电源非集中控制型','集中电源集中控制型','集中电源非集中控制型'], answer:1, explanation:'自带电源非集中控制型应急照明和疏散指示系统由自带电源型消防应急灯具等组成。' },
        { id:39, type:'single', text:'（C）适用于设置两个及以上消防控制室的保护对象，也适用于已设置两个及以上集中报警系统的保护对象。', options:['区域报警系统','集中报警系统','控制中心报警系统','消防联动控制系统'], answer:2, explanation:'控制中心报警系统适用于设置两个及以上消防控制室的保护对象。' },
        { id:40, type:'single', text:'可能产生蒸汽和油雾的场所不宜选择（C）火灾探测器。', options:['线型缆式感温','线型光纤感温','线型光束感烟','线型定温'], answer:2, explanation:'可能产生蒸气和油雾的场所不宜选择线型光束感烟火灾探测器。' },
        { id:41, type:'single', text:'《城市消防远程监控系统技术规范》（GB 50440），该标准于（D）起实施。', options:['2007.10.23','2008.10.23','2007.1.1','2008.1.1'], answer:3, explanation:'自2008年1月1日起实施。' },
        { id:42, type:'single', text:'进入应急广播状态后，消防应急广播在（C）内发出广播信息。', options:['3s','5S','10s','15s'], answer:2, explanation:'在10s内发出广播信息。' },
        { id:43, type:'single', text:'（B）是用来进行系统设置和设备管理的一个工作集。', options:['桌面','控制面板','任务栏','开始菜单'], answer:1, explanation:'控制面板是用来进行系统设置和设备管理的一个工作集。' },
        { id:44, type:'single', text:'消防救援时供消防救援人员进入的窗口，其净宽度不应小于（B）m。', options:['0.6','1.0','0.8','1.2'], answer:1, explanation:'净宽度不应小于1.0m。' },
        { id:45, type:'single', text:'当电气火灾监控设备面板上红色指示灯点亮，则说明电气火灾监控设备处于（B）状态。', options:['故障报警','监管报警','通信故障报警','备电故障报警'], answer:1, explanation:'红色指示灯点亮表示处于监管报警状态。' },
        { id:46, type:'single', text:'（A）的场所，不应采用预作用系统。', options:['环境温度不低于4℃且不高于70℃','系统处于准工作状态时严禁误喷','系统处于准工作状态时严禁管道充水','用于替代干式系统'], answer:0, explanation:'环境温度不低于4℃且不高于70℃的场所不应采用预作用系统。' },
        { id:47, type:'single', text:'《建筑设计防火规范》在对生产及储存物品场所的火灾危险性分类时，以闪点作为火灾危险性的特征对易燃可燃液体进行相应分类，其中，乙类液体是指（B）的液体。', options:['闪点<28℃','28℃≤闪点<60℃','闪点≥60℃','闪点≥45℃'], answer:1, explanation:'乙类液体是指28℃≤闪点<60℃的液体。' },
        { id:48, type:'single', text:'（B）是指连续探测某路线周围火灾参数的火灾探测器。', options:['点型火灾探测器','线型火灾探测器','火灾显示盘','火灾报警控制器'], answer:1, explanation:'线型火灾探测器是指连续探测某一路线周围火灾参数的火灾探测器。' },
        { id:49, type:'single', text:'（B）是做人的基本准则，也是社会道德和职业道德的一项基本规范。', options:['爱岗敬业','诚实守信','办事公道','奉献社会'], answer:1, explanation:'诚实守信是做人的基本准则。' },
        { id:50, type:'single', text:'《中华人民共和国消防法》于（C）进行了一次最新修订。', options:['2019-01-01','2020-01-01','2019-04-23','2020-4-23'], answer:2, explanation:'于2019年4月23日进行了第一次修订。' },
        { id:51, type:'single', text:'对于消防电梯，为方便火灾时消防人员接近和快速使用，其迫降要求是使电梯返回到指定层（一般为首层）并保持（B）的状态。', options:['开门停用','开门待用','关门停用','关门待用'], answer:1, explanation:'保持开门待用的状态。' },
        { id:52, type:'single', text:'防火卷帘的现场机械控制通过手动操作（C）实现。', options:['卷门机','卷轴','金属链条','手动按钮盒'], answer:2, explanation:'通过手动操作金属链条实现。' },
        { id:53, type:'single', text:'（D）是在职业分类的基础上，根据职业活动内容，对从业人员的理论知识和技能要求提出的综合性水平规定。', options:['职业分类','职业道德','行为规范','国家职业技能标准'], answer:3, explanation:'国家职业技能标准是在职业分类的基础上提出的综合性水平规定。' },
        { id:54, type:'single', text:'防火墙是防止火灾蔓延至相邻建筑或相邻水平防火分区且耐火极限不低于（B）h的不燃性墙体。', options:['2','3','4','5'], answer:1, explanation:'耐火极限不低于3h。' },
        { id:55, type:'single', text:'（A）是将水流信号转换为电信号的一种报警装置，一般安装在自动喷水灭火系统的分区配水管上。', options:['水流指示器','压力开关','信号蝶阀','水力警铃'], answer:0, explanation:'水流指示器是将水流信号转换为电信号的一种报警装置。' },
        { id:56, type:'single', text:'构件背面平均温升超过初始平均温度（B）℃则认为丧失隔热性。', options:['100','140','180','200'], answer:1, explanation:'超过140℃则认为丧失隔热性。' },
        { id:57, type:'single', text:'（A）应划为第二类防雷建筑物。', options:['国家级计算中心','省级档案馆','炸药仓库','年预计雷击次数大于和等于0.09次的一般性工业建筑物'], answer:0, explanation:'国家级计算中心应划为第二类防雷建筑物。' },
        { id:58, type:'single', text:'（B）适用于不仅需要报警，同时需要联动自动消防设备，且只设置一台具有集中控制功能的火灾报警控制器和消防联动控制器的保护对象。', options:['区域报警系统','集中报警系统','控制中心报警系统','消防联动控制系统'], answer:1, explanation:'集中报警系统适用于不仅需要报警，同时需要联动自动消防设备的保护对象。' },
        { id:59, type:'single', text:'（D）是指以水、渗透剂、阻燃剂以及其他添加剂组成，一般以液滴或以液滴和泡沫混合的形式灭火的液体灭火剂。', options:['干粉灭火剂','气体灭火剂','泡沫灭火剂','水系灭火剂'], answer:3, explanation:'水系灭火剂是指以水、渗透剂、阻燃剂以及其他添加剂组成的液体灭火剂。' },
        { id:60, type:'single', text:'仅需要报警，不需要联动自动消防设备的保护对象宜采用（D）。', options:['独立型报警系统','控制中心报警系统','集中报警系统','区域报警系统'], answer:3, explanation:'仅需要报警，不需要联动自动消防设备的保护对象宜采用区域报警系统。' },
        { id:61, type:'single', text:'（D）都有维护消防安全、保护消防设施、预防火灾、报告火警的义务。', options:['成年人','个人','任何单位','任何单位和个人'], answer:3, explanation:'任何单位和个人都有维护消防安全、保护消防设施、预防火灾、报告火警的义务。' },
        { id:62, type:'single', text:'以自动直接启动或手动直接启动消防水泵时，消防水泵应在（D）s内投入正常运行，且应无不良噪声和振动。', options:['45','30','60','55'], answer:3, explanation:'应在55s内投入正常运行。' },
        { id:63, type:'single', text:'（B）是消防设施操作员应该具备的最基本的心理素质。', options:['精益求精','临危不乱','科学处置','严守规程'], answer:1, explanation:'临危不乱是消防设施操作员应该具备的最基本的心理素质。' },
        { id:64, type:'single', text:'《自动喷水灭火系统设计规范》于2017年5月27日颁布，自（C）实施。', options:['2017年5月27日','2019年5月27日','2018年1月1日','2018年5月27日'], answer:2, explanation:'自2018年1月1日实施。' },
        { id:65, type:'single', text:'（D）是指windows快速执行程序，打开文件，打开文件夹，访问系统资源的特殊图形对象。', options:['开始菜单','文件','文件夹','快捷方式'], answer:3, explanation:'快捷方式是指windows快速执行程序，打开文件，打开文件夹，访问系统资源的特殊图形对象。' },
        { id:66, type:'single', text:'公众聚集场所未经（D）许可的，不得投入使用营业。', options:['公安机关','应急管理部门','地方人民政府','消防救援机构'], answer:3, explanation:'公众聚集场所未经消防救援机构许可的，不得投入使用营业。' },
        { id:67, type:'single', text:'保养报警阀组时，应检查延迟器的（A），防止异物堵塞影响功能。', options:['漏水接头','阀门','过滤器','管路'], answer:0, explanation:'检查湿式系统延迟器的漏水接头。' },
        { id:68, type:'single', text:'（D）是一款具备检测低压配电线路中剩余电流和线路温度功能，且能够独立使用的电气火灾监控探测器。', options:['剩余电流式电气火灾监控探测器','故障电弧探测器','测温式电气火灾监控探测器','独立式电气火灾监控探测器'], answer:3, explanation:'独立式电气火灾监控探测器是一款具备检测低压配电线路中剩余电流和线路温度功能且能够独立使用的探测器。' },
        { id:69, type:'single', text:'当电气火灾监控设备发出救护车警报声时，不可能出现的状态是（D）。', options:['通信故障','传感器短路故障','传感器断路故障','系统故障'], answer:3, explanation:'系统故障时发出的是系统故障信号，不是救护车警报声。' },
        { id:70, type:'single', text:'发生火灾时，集中电源非集中控制型消防应急照明和疏散指示系统的（C）联动控制集中电源和/或应急照明分配电装置的工作状态，进而控制各路消防应急灯具的工作状态。', options:['火灾报警控制器或消防联动控制器','应急照明集中控制器','消防联动控制器','火灾报警控制器'], answer:2, explanation:'消防联动控制器联动控制集中电源和/或应急照明分配电装置的工作状态。' },
        { id:71, type:'single', text:'（A）是消火栓管网内能始终保持满足水灭火设施所需的工作压力和流量，火灾时无须消防水泵直接加压的供水系统。', options:['高压消防给水系统','临时高压消防给水统','低压消防给水系统','独立消防给水系统'], answer:0, explanation:'高压消防给水系统是消火栓管网内能始终保持满足水灭火设施所需的工作压力和流量，火灾时无须消防水泵直接加压的供水系统。' },
        { id:72, type:'single', text:'对于一些重要的联动设备(如消防泵组、防烟和排烟风机)的控制，除采用联动控制方式外，火灾报警控制器还应采用（A）控制方式。', options:['多线控制盘','总线控制盘','间接控制盘','直接控制盘'], answer:0, explanation:'还应采用多线控制盘控制方式。' },
        { id:73, type:'single', text:'有关自然排烟和自然通风的说法，正确的是（C）。', options:['自然通风不易受外部条件的影响，是一种理想的排烟方式。','自然通风不属于防烟方式。','自然排烟是最简单、不消耗动力的排烟方式。','自然排烟不属于排烟方式。'], answer:2, explanation:'自然排烟是最简单、不消耗动力的排烟方式。' },
        { id:74, type:'single', text:'（D）火灾是指烹饪器具内的烹饪物（如动植物油脂）火灾。', options:['A类','B类','E类','F类'], answer:3, explanation:'F类火灾是指烹饪器具内的烹饪物火灾。' },
        { id:75, type:'single', text:'《中华人民共和国劳动法》是从（C）起开始施行的。', options:['1994年7月5日','1994年10月1日','1995年1月1日','1995年7月5日'], answer:2, explanation:'从1995年1月1日起开始施行。' },
        { id:76, type:'single', text:'对扩音机进行全负荷试验，在（C）下测试应急广播功能，监听扬声器的声音输出，应语音清晰、声音响亮。', options:['自动状态','手动状态','手动状态和自动状态','以上都对'], answer:2, explanation:'在手动状态和自动状态下测试应急广播功能。' },
        { id:77, type:'single', text:'（A）可对烟雾、温度、火焰辐射、气体浓度等火灾参数进行响应，并自动产生火灾报警信号。', options:['火灾探测器','手动火灾报警按钮','火灾声光警报器','火灾报警控制器'], answer:0, explanation:'火灾探测器可对烟雾、温度、火焰辐射、气体浓度等火灾参数进行响应。' },
        { id:78, type:'single', text:'（C）能终止与任意消防电话分机的通话，且不影响与其他消防电话分机的通话。', options:['消防电话系统','消防电话分机','消防电话总机','插孔移动电话'], answer:2, explanation:'消防电话总机能终止与任意消防电话分机的通话，且不影响与其他消防电话分机的通话。' },
        { id:79, type:'single', text:'对集中火灾报警控制器、消防联动控制器、消防控制室图形显示装置的打印机的保养方法中正确是（A）。', options:['打印机走纸不正常或者打印文字不清晰应及时修复','打印机不宜长时间通电','打印纸无备量','打印机不应设置为即时打印'], answer:0, explanation:'打印机走纸不正常或者打印文字不清晰应及时修复。' },
        { id:80, type:'single', text:'《石油库设计规范》中根据（C），将液体分为易燃液体和可燃液体两种类型。', options:['燃点','自燃点','闪点','氧指数'], answer:2, explanation:'根据闪点将液体分为易燃液体和可燃液体。' },
        { id:81, type:'single', text:'对于采用（B）消防给水系统的高层或多层建筑，当高位消防水箱的设置不能满足系统最不利点处的静压要求时，应在建筑消防给水系统中设置增(稳)压设施，并采取配套设置气压罐等防止稳压泵频繁启停的技术措施。', options:['高压','临时高压','低压','常压'], answer:1, explanation:'对于采用临时高压消防给水系统的高层或多层建筑。' },
        { id:82, type:'multiple', text:'火灾自动报警系统的工作状态可以通过（ACE）等方式显示出来。', options:['面板指示灯','火警指示状态','提示音','消音状态','文字'], answer:[0,2,4], explanation:'工作状态可通过面板指示灯、提示音和文字等方式显示出来。' },
        { id:83, type:'multiple', text:'机关，团体，企业，事业等单位应当落实消防安全主体责任，履行（ABCD）等职责。', options:['按照相关要求标准配备消防设施及器材','保障疏散通道、安全出口等符合消防技术标准','明确各级各岗位消防安全责任人','保证防火检查巡查','建立消防档案确定消防安全重点部位'], answer:[0,1,2,3], explanation:'E选项是消防安全重点单位应履行的职责。' },
        { id:84, type:'multiple', text:'根据所安装喷头的结构形式，自动喷水灭火系统可分为开式系统和闭式系统两大类，（ABCE）属于闭式系统。', options:['湿式系统','干式系统','预作用系统','雨淋系统','重复启闭预作用系统'], answer:[0,1,2,4], explanation:'湿式、干式、预作用、重复启闭预作用系统属于闭式系统。' },
        { id:85, type:'multiple', text:'根据现场设备功能的不同，工作状态可分为（ABCDE）、反馈等。', options:['正常','火警','故障','启动','屏蔽'], answer:[0,1,2,3,4], explanation:'工作状态可分为正常、火警、故障、启动、屏蔽、反馈等。' },
        { id:86, type:'multiple', text:'集中火灾报警系统由（ACDE）、手动火灾报警按钮、火灾声光报警器、消防应急广播、消防专用电话等组成。', options:['集中火灾报警控制器','区域火灾报警控制器','消防联动控制器','消防控制室图形显示装置','火灾探测器'], answer:[0,2,3,4], explanation:'集中火灾报警系统由火灾探测器、手动火灾报警按钮、火灾声光警报器、消防应急广播、消防专用电话、消防控制室图形显示装置、集中火灾报警控制器、消防联动控制器等组成。' },
        { id:87, type:'multiple', text:'机械加压送风系统主要由（BCD）以及电气控制柜等组成。', options:['净化设备','送风机','风道','送风口','可开启外窗'], answer:[1,2,3], explanation:'机械加压送风系统主要由送风机、风道、送风口以及电气控制柜等组成。' },
        { id:88, type:'multiple', text:'红外光束线型感烟火灾探测器分为（AB）两种。', options:['对射型','反射型','折射型','辐射型'], answer:[0,1], explanation:'红外光束线型感烟火灾探测器分为对射型和反射型两种。' },
        { id:89, type:'multiple', text:'加压送风机可通过（ACDE）方式控制。', options:['现场手动启动','机械应急启动','通过火灾自动报警系统自动启动','消防控制室手动启动','系统中任一常闭加压送风口开启时，加压送风机自动启动'], answer:[0,2,3,4], explanation:'加压送风机可通过现场手动、自动、消防控制室手动、常闭加压送风口开启时自动启动等方式控制。' },
        { id:90, type:'multiple', text:'防火门监控器应具备（ABCDE）显示功能、反馈功能及自检功能。', options:['备用电源功能','故障报警功能','信息记录、查询与上传功能','控制功能','主、备电源转换功能'], answer:[0,1,2,3,4], explanation:'防火门监控器应具备以上所有功能。' },
        { id:91, type:'multiple', text:'可使用（ABC）清洗线型光束感烟火灭探测器的外壳，指示灯和光路通过的窗口等部件。', options:['专用清洁工具','软布','清洁剂','纸壳','油抹布'], answer:[0,1,2], explanation:'用专用清洁工具或软布及适当的清洁剂清洗。' },
        { id:92, type:'multiple', text:'防火门按照耐火性能可分为（ABD）。', options:['隔热防火门','非隔热防火门','木质防火门','部分隔热防火门','钢质防火门'], answer:[0,1,3], explanation:'防火门按照耐火性能可分为隔热防火门、部分隔热防火门和非隔热防火门三类。' },
        { id:93, type:'multiple', text:'集中报警系统主要由火灾探测器、手动报警按钮、火灾声光警报器、（ABCDE）等组成。', options:['消防广播系统','消防专用电话','消防控制室图形显示装置','消防联动控制器','火灾报警控制器'], answer:[0,1,2,3,4], explanation:'集中报警系统主要由以上设备组成。' },
        { id:94, type:'multiple', text:'计算机是由（CD）和（）两部分组成的。', options:['操作系统','传输系统','硬件系统','软件系统','存储系统'], answer:[2,3], explanation:'计算机是由硬件系统和软件系统两部分组成的。' },
        { id:95, type:'multiple', text:'工业建筑有（BD）。', options:['居民住宅','厂房','影剧院','库房','暖棚'], answer:[1,3], explanation:'工业建筑有厂房、库房。' },
        { id:96, type:'multiple', text:'火灾自动报警系统中的（ADE）一般应设置在消防控制室内或有人值班的房间和场所。', options:['集中火灾报警控制器','触发装置','声光报警装置','消防联动控制器','消防控制室图形显示装置'], answer:[0,3,4], explanation:'集中火灾报警控制器、消防联动控制器、消防控制室图形显示装置一般应设置在消防控制室内。' },
        { id:97, type:'multiple', text:'防火卷帘一般设置在（ABCE）部位。', options:['生产车间中大面积工艺洞口','设置防火墙有困难的部位','电梯厅、自动扶梯周围','建筑中需要防火分隔的','中庭与楼层走道、过厅相通的开口部位'], answer:[0,1,2,4], explanation:'防火卷帘一般设置在电梯厅、自动扶梯周围，中庭与楼层走道过厅相通的开口部位，生产车间中大面积工艺洞口以及设置防火墙有困难的部位等。' },
        { id:98, type:'multiple', text:'根据《建筑设计防火规范》(GB50016)的规定，自动喷水灭火系统的设置场所分为（ADE）。', options:['民用建筑','构筑物','建筑物','仓库','厂房'], answer:[0,3,4], explanation:'自动喷水灭火系统的设置场所分为厂房、仓库和民用建筑三大类。' },
        { id:99, type:'multiple', text:'固定消防炮灭火系统按控制方式可分为（CD）', options:['固定式消防炮系统','移动式消防炮系统','非远控消防炮系统','远控消防炮系统','智能型消防炮灭火系统'], answer:[2,3], explanation:'固定消防炮灭火系统按控制方式可分为远控消防炮系统和非远控消防炮系统。' },
        { id:100, type:'multiple', text:'集中火灾报警控制器能直接或间接接收来自火灾探测器及其他火灾报警触发器件的火灾报警信号，发出（AD），指示火灾发生部位，记录火灾报警时间。', options:['火灾报警声','电信号','数字信号','光信号','图像信息'], answer:[0,3], explanation:'发出火灾报警声、光信号。' },
        { id:101, type:'multiple', text:'关于消防电话各组件的设置要求，说法正确的是（BCDE）。', options:['电话插孔在墙上安装时，其底边距地面高度宜为1.1~1.3m','多线制消防电话系统中的每个电话分机应与总机单独连接','设有手动火灾报警按钮或消火栓按钮等处宜设置电话插孔，并宜选择带有电话插孔的手动报警按钮','消防电话分机应固定安装在明显且便于使用的部位','消防控制室应设置消防电话总机'], answer:[1,2,3,4], explanation:'电话插孔在墙上安装时，其底边距地面高度宜为1.3~1.5m，A错误。' },
        { id:102, type:'multiple', text:'集中火灾报警控制器、消防联动控制器、消防控制室图形装置的保养项目包含（ABCDE）等。', options:['外壳外观保养','显示屏保养','打印机保养','指示灯保养','开关按键、键盘、鼠标保养'], answer:[0,1,2,3,4], explanation:'保养项目包含外壳外观、指示灯、显示屏、开关按键、键盘鼠标、打印机保养。' },
        { id:103, type:'multiple', text:'集中火灾报警控制器在接收到火灾探测器或其他火灾报警触发器件发出的火灾报警信号后，根据预定的控制逻辑向相关消防联动控制装置发出控制信号，控制各类消防设备（ACE）等消防保护功能。', options:['实现人员疏散','把伤员抬走','限制火势蔓延','切断所有电源','自动灭火'], answer:[0,2,4], explanation:'控制各类消防设备实现人员疏散、限制火势蔓延和自动灭火等消防保护功能。' },
        { id:104, type:'multiple', text:'机械排烟系统主要由（ABCDE）、电气控制柜等组成。', options:['排烟阀(排烟口)','排烟防火阀','排烟风机','排烟管道','挡烟垂壁'], answer:[0,1,2,3,4], explanation:'机械排烟系统主要由排烟风机、排烟管道、排烟阀、排烟防火阀、电气控制柜、挡烟垂壁等组成。' },
        { id:105, type:'multiple', text:'火灾显示盘具有（ABCDE）功能。', options:['信息显示与查询','自检','火灾报警显示','电源','故障显示'], answer:[0,1,2,3,4], explanation:'火灾显示盘具有以上所有功能。' },
        { id:106, type:'multiple', text:'防火卷帘按照启闭方式可以分成（BCD）类。', options:['单帘面防火卷帘','侧向式防火卷帘','垂直式防火卷帘','水平式防火卷帘','竖式防火卷帘'], answer:[1,2,3], explanation:'防火卷帘按启闭方式可分为垂直式、侧向式、水平式防火卷帘。' },
        { id:107, type:'multiple', text:'防火卷帘具有（ABCDE）、现场机械控制和限位控制等主要几种控制方式。', options:['现场手动电控','自动控制','消防控制室远程手动控制','温控释放控制','速放控制'], answer:[0,1,2,3,4], explanation:'防火卷帘具有以上所有控制方式。' },
        { id:108, type:'multiple', text:'集中控制器的历史信息包括（ABCD）等。', options:['火警信息','故障信息','反馈信息','操作信息','系统故障消息'], answer:[0,1,2,3], explanation:'集中控制器的历史信息包括火警信息、故障信息、反馈信息、操作信息等。' },
        { id:109, type:'multiple', text:'可以扑救带电设备火灾的灭火剂是（AC）。', options:['干粉灭火剂','水系灭火剂','二氧化碳灭火剂','泡沫灭火剂'], answer:[0,2], explanation:'扑救带电设备火灾应选用卤代烷、二氧化碳、干粉等灭火剂。' },
        { id:110, type:'multiple', text:'多线控制盘操作面板上设有多个手动控制单元，每个单元包括一个操作按钮和（ABC）三个状态指示灯。', options:['启动','反馈','故障','停止','动作'], answer:[0,1,2], explanation:'每个单元包括一个操作按钮和启动、反馈、故障三个状态指示灯。' },
        { id:111, type:'multiple', text:'对于消防控制室图形显示装置应先断开（ABC），使装置完全处于无源状态。', options:['交流电源','UPS电源','网络连接','EPS电源','蓄电池电源'], answer:[0,1,2], explanation:'先断开交流电源、UPS电源和网络连接。' },
        { id:112, type:'multiple', text:'防火卷帘通常可按照（BCE）等进行分类。', options:['厚度','材质','启闭方式','动作温度','帘面数量'], answer:[1,2,4], explanation:'防火卷帘通常可按照材质、帘面数量、启闭方式等进行分类。' },
        { id:113, type:'multiple', text:'防火间距由于场地等原因，难以满足国家规范的要求时，可根据建筑的实际情况采取（ABCDE）措施。', options:['改变建筑的生产和使用性质，尽量降低建筑的火灾危险性','改变房屋部分结构的耐火性能，提高建筑的耐火等级','建筑的普通外墙改造为防火墙或减小相邻建筑的开口面积','拆除部分耐火等级低、占地面积小、存在价值低且与新建筑相邻的原有陈旧建筑','设置独立的室外防火墙'], answer:[0,1,2,3,4], explanation:'以上措施均可采取。' },
        { id:114, type:'judge', text:'火灾显示盘的信息显示应按火灾报警、故障、监管报警的顺序由高至低排列显示等级。（错）', options:['对','错'], answer:1, explanation:'火灾显示盘的信息显示应按火灾报警、监管报警、故障的顺序由高至低排列显示等级。' },
        { id:115, type:'judge', text:'激光光束线型感烟火灾探测器可分为对射型和反射型两种。（错）', options:['对','错'], answer:1, explanation:'红外光束线型感烟火灾探测器可分为对射型和反射型两种。' },
        { id:116, type:'judge', text:'开机密码是指在开机后，进入操作系统之前要求用户输入的密码，密码正确才可以进行操作系统的启动该密码可以防止非授权用户开机。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:117, type:'judge', text:'防火门、防火卷帘均属于建筑物设置的防火分隔设施，在火灾发生时，可以在一定时间内起到阻火、隔烟效果。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:118, type:'judge', text:'火灾自动报警系统控制器的电源工作状态分为主电工作状态、备电工作状态、主电故障状态和备电故障状态。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:119, type:'judge', text:'防火卷帘卷门机上设有手动拉链，可通过人工拉动拉链控制卷帘升降。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:120, type:'judge', text:'保护对象仅需要火灾报警，则火灾报警控制器的火灾报警系统选集中火灾报警系统。（错）', options:['对','错'], answer:1, explanation:'仅需要报警应选区域报警系统。' },
        { id:121, type:'judge', text:'防烟系统：当防火分区内火灾确认后，应开启该防火分区内着火层及其相邻上下层前室及合用前室的常闭送风口，同时开启加压送风机。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:122, type:'judge', text:'具有可燃性的粉尘遇明火一定会发生爆炸。（错）', options:['对','错'], answer:1, explanation:'具有可燃性的粉尘遇明火不一定会发生爆炸。' },
        { id:123, type:'judge', text:'火灾探测报警产品的使用或管理单位应根据产品使用场所环境及产品保养要求制订保养计划。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:124, type:'judge', text:'机关、团体、企业、事业等单位，应当加强对本单位人员的消防宣传教育。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:125, type:'judge', text:'建筑面积不小于500平方米的电影摄影棚应设置雨淋自动喷水灭火系统。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:126, type:'judge', text:'接线检查应在消防电话总机通电状态下进行。（错）', options:['对','错'], answer:1, explanation:'接线检查应在消防电话总机断电状态下进行。' },
        { id:127, type:'judge', text:'甲、乙、丙类仓库内的防火墙，其耐火极限不应低于4.00h。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:128, type:'judge', text:'防火墙是建筑水平防火分区的主要防火分隔物，由难燃烧材料构成。（错）', options:['对','错'], answer:1, explanation:'防火墙是由不燃烧体构成，耐火极限不低于3h。' },
        { id:129, type:'judge', text:'干式系统发生火灾时，闭式喷头受热开启，管道中的有压气体从喷头喷出，干式报警阀系统侧压力下降，造成水源侧压力大于系统侧压力，干式报警阀自动打开，压力水进入供水管道，使剩余压缩空气从系统立管顶端或横干管最高处的排气阀或已打开的喷头处喷出，然后喷水灭火。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:130, type:'judge', text:'具有多通道的线型感温火灾探测器应可指示出报警通道。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:131, type:'judge', text:'固体热量能够在物质中发生热对流。（错）', options:['对','错'], answer:1, explanation:'热对流只能发生在流体中。' },
        { id:132, type:'judge', text:'对于一些需要及时操作的受控消防设备，可以通过多线控制盘进行控制。（错）', options:['对','错'], answer:1, explanation:'对于一些需要及时操作的受控消防设备，可以通过总线控制盘进行控制。' },
        { id:133, type:'judge', text:'火灾报警控制器/消防联动控制器运行模式处于"自动允许"时，可通过联动控制装置自动启动消防应急广播系统，进行消防应急广播。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:134, type:'judge', text:'干式系统准工作状态时配水管道内充满用于启动系统的有压气体，火灾发生时，喷头受热开启，配水管道排气充水后喷水灭火，系统响应速度比湿式系统慢。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:135, type:'judge', text:'附设在建筑内的消防控制室应采用防火门、防火窗、耐火极限不低于2.00h的防火隔墙和耐火极限不低于1.50h的楼板与其他部位分隔。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:136, type:'judge', text:'具备了燃烧必要条件，并不意味着必定会发生燃烧。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:137, type:'judge', text:'火灾现场是指发生火灾的地点和留有与火灾原因有关痕迹物证的场所。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:138, type:'judge', text:'防火分区是指在建筑内部采用防火墙、楼板及其他防火分隔设施分隔而成，能在一定时间内防止火灾向同一建筑的其余部分蔓延的局部空间。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:139, type:'judge', text:'对风机控制柜保养前，应先断开主电源。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:140, type:'judge', text:'集中火灾报警控制器的电源部分应具有主电源和备用电源转换装置。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:141, type:'judge', text:'防火门电动闭门器是使常开防火门保持打开状态，在收到指令后释放防火门使其关闭，并将本身的状态信息等反馈至防火门监控器的电动装置。（错）', options:['对','错'], answer:1, explanation:'防火门电磁释放器是使常开防火门保持打开状态的电动装置。' },
        { id:142, type:'judge', text:'计算机的中央处理器又叫GPU。（错）', options:['对','错'], answer:1, explanation:'计算机的中央处理器又叫CPU。' },
        { id:143, type:'judge', text:'建筑高度大于24米的单层体育馆，属于高层建筑。（错）', options:['对','错'], answer:1, explanation:'建筑高度大于24米的单层体育馆，属于单、多层民用建筑。' },
        { id:144, type:'judge', text:'歌舞娱乐放映游艺场所布置在地下一层或地上四层及以上楼层时，每个房间的建筑面积不应大于200㎡。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:145, type:'judge', text:'对于干式报警阀组，在开启警铃试验阀前，应首先关闭报警管路控制阀。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:146, type:'judge', text:'防火门门磁开关主要用于实时监控和反馈防火门的工作状态，接收控制指令后控制常开防火门关闭。（错）', options:['对','错'], answer:1, explanation:'防火门监控模块主要用于实时监控和反馈防火门的工作状态。' },
        { id:147, type:'judge', text:'防火插销应安装在双扇门或多扇门相对固定一侧的门扇上。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:148, type:'judge', text:'防火卷帘配套使用的温控释放装置一般分为易熔金属温控释放器、闭式玻璃球温控释放器两种类型。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:149, type:'judge', text:'根据"消防设施操作员"国家职业技能标准，消防设施检测维修保养职业方向分级为四级。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:150, type:'judge', text:'具有接收火灾报警控制器传来的火灾探测器、手动火灾报警按钮及其他火灾报警触发器件的故障信号的火灾显示盘，应在火灾报警控制器发出故障信号后3s内发出故障声、光信号，并指示故障发生部位。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:151, type:'judge', text:'机械加压送风机可采用中、高压离心风机或轴流风机。（错）', options:['对','错'], answer:1, explanation:'机械加压送风机可采用中、低压离心风机或轴流风机。' },
        { id:152, type:'judge', text:'固定式挡烟垂壁采用难燃材料制作，垂直安装在建筑顶棚、梁或吊顶下。（错）', options:['对','错'], answer:1, explanation:'固定式挡烟垂壁采用不燃材料制作。' },
        { id:153, type:'judge', text:'固定式泡沫灭火系统适用于单罐容量大于1000m³的甲、乙、丙类液体固定顶罐。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:154, type:'judge', text:'根据电气火灾监控设备面板的各报警类型专用指示灯点亮情况和报警声信号形式，判断电气火灾监控设备报警信号类别，然后进行消音操作。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:155, type:'judge', text:'集中火灾报警控制器主要包括：显示板（含显示屏）、指示灯、开关和按钮、打印机、主板、输入/输出控制板、音响器件、网络接口组件、电源装置（含电池），外壳等组成。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:156, type:'judge', text:'多线控制盘的手动启动与消防联动控制器是否正常无关，只需确保多线控制盘的电源打开，手动工作模式处于"允许"状态。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:157, type:'judge', text:'公民基本道德行为规范与职业道德行为规范之间是从属关系。（错）', options:['对','错'], answer:1, explanation:'公民基本道德行为规范包含了职业道德行为规范，两者是包含与被包含的关系。' },

        { id:160, type:'judge', text:'对于一些重要的联动设备(如消防泵组、防烟和排烟风机)的控制，除采用联动控制方式外，火灾报警控制器还应采用总线控制盘控制方式，实现直接手动控制。（错）', options:['对','错'], answer:1, explanation:'应采用多线控制盘控制方式实现直接手动控制。' },
        { id:161, type:'judge', text:'触电的主要形式有：单相触电、两相触电、三相触电。（错）', options:['对','错'], answer:1, explanation:'触电的主要形式有：单相触电、两相触电、跨步电压触电。' },
