        { id:149, type:'judge', text:'根据"消防设施操作员"国家职业技能标准，消防设施检测维修保养职业方向分级为四级。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:150, type:'judge', text:'具有接收火灾报警控制器传来的火灾探测器、手动火灾报警按钮及其他火灾报警触发器件的故障信号的火灾显示盘，应在火灾报警控制器发出故障信号后3s内发出故障声、光信号，并指示故障发生部位。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:151, type:'judge', text:'机械加压送风机可采用中、高压离心风机或轴流风机。（错）', options:['对','错'], answer:1, explanation:'机械加压送风机可采用中、低压离心风机或轴流风机。' },
        { id:152, type:'judge', text:'固定式挡烟垂壁采用难燃材料制作，垂直安装在建筑顶棚、梁或吊顶下。（错）', options:['对','错'], answer:1, explanation:'固定式挡烟垂壁采用不燃材料制作。' },
        { id:153, type:'judge', text:'固定式泡沫灭火系统适用于单罐容量大于1000m³的甲、乙、丙类液体固定顶罐。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:154, type:'judge', text:'根据电气火灾监控设备面板的各报警类型专用指示灯点亮情况和报警声信号形式，判断电气火灾监控设备报警信号类别，然后进行消音操作。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:155, type:'judge', text:'集中火灾报警控制器主要包括：显示板（含显示屏）、指示灯、开关和按钮、打印机、主板、输入/输出控制板、音响器件、网络接口组件、电源装置（含电池），外壳等组成。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:156, type:'judge', text:'多线控制盘的手动启动与消防联动控制器是否正常无关，只需确保多线控制盘的电源打开，手动工作模式处于"允许"状态。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:157, type:'judge', text:'公民基本道德行为规范与职业道德行为规范之间是从属关系。（错）', options:['对','错'], answer:1, explanation:'公民基本道德行为规范包含了职业道德行为规范，两者是包含与被包含的关系。' },
        { id:158, type:'judge', text:'服装加工厂房火灾危险性为丙类。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:159, type:'judge', text:'粉尘爆炸压力上升和下降速度都较快。（错）', options:['对','错'], answer:1, explanation:'粉尘爆炸压力上升和下降速度都较慢。' },
        { id:160, type:'judge', text:'对于一些重要的联动设备(如消防泵组、防烟和排烟风机)的控制，除采用联动控制方式外，火灾报警控制器还应采用总线控制盘控制方式，实现直接手动控制。（错）', options:['对','错'], answer:1, explanation:'应采用多线控制盘控制方式实现直接手动控制。' },
        { id:161, type:'judge', text:'触电的主要形式有：单相触电、两相触电、三相触电。（错）', options:['对','错'], answer:1, explanation:'触电的主要形式有：单相触电、两相触电、跨步电压触电。' },
        { id:162, type:'judge', text:'对应急广播设备进行保养，应用软布擦拭应急广播设备主机外壳和扬声器。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:163, type:'judge', text:'防火门监控器应有防火门故障状态总指示灯。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:164, type:'judge', text:'具备可燃物、助燃物、引火源3个条件，必然会发生燃烧。（错）', options:['对','错'], answer:1, explanation:'要导致燃烧发生，不仅需要满足三要素条件，而且需要三者达到一定量的要求。' },
        { id:165, type:'judge', text:'防火卷帘按帘面数量可分为单帘面防火卷帘、双帘面防火卷帘和多帘面防火卷帘。（错）', options:['对','错'], answer:1, explanation:'防火卷帘按帘面数量可分为单帘面防火卷帘、双帘面防火卷帘。' }
      ]
    }
  ];

  // ========== 全局状态 ==========
  let currentPaper = null;
  let currentQuestions = [];
  let userAnswers = {};
  let activeQuestionId = null;
  let isSubmitted = false;
  let score = 0;
  let randomMode = false;
  let noHighlight = false;
  let historyVisible = false;
  let historyRecords = [];

  // DOM
  const totalCountEl = document.getElementById('totalCount');
  const answeredCountEl = document.getElementById('answeredCount');
  const unansweredCountEl = document.getElementById('unansweredCount');
  const questionGrid = document.getElementById('questionGrid');
  const paperTitle = document.getElementById('paperTitle');
  const paperSub = document.getElementById('paperSub');
  const questionsContainer = document.getElementById('questionsContainer');
  const selectPaperBtn = document.getElementById('selectPaperBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const paperList = document.getElementById('paperList');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const cardPaperName = document.getElementById('cardPaperName');
  const actionBtns = document.getElementById('actionBtns');
  const submitBtn = document.getElementById('submitBtn');
  const resetBtn = document.getElementById('resetBtn');
  const randomCheckWrap = document.getElementById('randomCheckWrap');
  const randomCheck = document.getElementById('randomCheck');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const cancelSubmitBtn = document.getElementById('cancelSubmitBtn');
  const confirmSubmitBtn = document.getElementById('confirmSubmitBtn');
  const historySection = document.getElementById('historySection');
  const historyHeader = document.getElementById('historyHeader');
  const historyArrow = document.getElementById('historyArrow');
  const historyList = document.getElementById('historyList');

  // ---------- 工具 ----------
  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function shuffleAndRenumber(questions) {
    const singles = questions.filter(q => q.type === 'single');
    const multiples = questions.filter(q => q.type === 'multiple');
    const judges = questions.filter(q => q.type === 'judge');
    const shuffled = [
      ...shuffleArray(singles),
      ...shuffleArray(multiples),
      ...shuffleArray(judges)
    ];
    return shuffled.map((q, index) => ({
      ...q,
      displayId: index + 1
    }));
  }

  function renumber(questions) {
    return questions.map((q, index) => ({
      ...q,
      displayId: index + 1
    }));
  }

  function initAnswersForPaper(paperId) {
    if (!userAnswers[paperId]) userAnswers[paperId] = {};
  }

  function getAnsweredCount(paperId, questions) {
    if (!paperId || !questions) return 0;
    const answers = userAnswers[paperId] || {};
    let count = 0;
    questions.forEach(q => {
      if (answers[q.id] !== undefined) count++;
    });
    return count;
  }

  function updateStats() {
    if (!currentPaper) {
      totalCountEl.textContent = '0';
      answeredCountEl.textContent = '0';
      unansweredCountEl.textContent = '0';
      return;
    }
    const total = currentQuestions.length;
    const answered = getAnsweredCount(currentPaper.id, currentQuestions);
    totalCountEl.textContent = total;
    answeredCountEl.textContent = answered;
    unansweredCountEl.textContent = total - answered;
  }

  function renderQuestionButtons() {
    if (!currentPaper) { questionGrid.innerHTML = ''; return; }
    const answers = userAnswers[currentPaper.id] || {};
    let html = '';
    currentQuestions.forEach(q => {
      const isAnswered = answers[q.id] !== undefined;
      const isActive = activeQuestionId === q.id;
      let extraClass = '';
      if (isSubmitted) {
        const correct = isAnswerCorrect(q, answers[q.id]);
        extraClass = correct ? 'correct' : 'wrong';
      } else {
        extraClass = isAnswered ? 'answered' : '';
      }
      const activeClass = isActive ? 'active' : '';
      html += `<button class="question-btn ${extraClass} ${activeClass}" data-qid="${q.id}">${q.displayId}</button>`;
    });
    questionGrid.innerHTML = html;
  }

  function isAnswerCorrect(q, answer) {
    if (answer === undefined) return false;
    if (q.type === 'single' || q.type === 'judge') return answer === q.answer;
    if (q.type === 'multiple') {
      if (!Array.isArray(answer) || !Array.isArray(q.answer)) return false;
      const a = [...answer].sort((x,y)=>x-y);
      const b = [...q.answer].sort((x,y)=>x-y);
      return a.length === b.length && a.every((v,i) => v === b[i]);
    }
    return false;
  }

  function updateActiveQuestionHighlight() {
    document.querySelectorAll('.question-item').forEach(el => el.classList.remove('active-question'));
    if (activeQuestionId) {
      const activeEl = document.querySelector(`.question-item[data-qid="${activeQuestionId}"]`);
      if (activeEl) activeEl.classList.add('active-question');
    }
  }

  function scrollToQuestion(questionId) {
    if (!currentPaper) return;
    const targetEl = document.querySelector(`.question-item[data-qid="${questionId}"]`);
    if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    activeQuestionId = questionId;
    renderQuestionButtons();
    updateActiveQuestionHighlight();
    if (noHighlight) {
      setTimeout(() => {
        document.querySelectorAll('.question-item').forEach(el => el.classList.remove('active-question'));
      }, 1000);
    }
  }

  function handleAnswerSelect(paperId, questionId, answerValue, type) {
    if (!currentPaper || currentPaper.id !== paperId || isSubmitted) return;
    initAnswersForPaper(paperId);
    if (type === 'single' || type === 'judge') {
      userAnswers[paperId][questionId] = answerValue;
    } else if (type === 'multiple') {
      userAnswers[paperId][questionId] = answerValue;
    }
    updateStats();
    renderQuestionButtons();
  }

  function renderPaperContent() {
    if (!currentPaper) {
      paperTitle.textContent = '请选择试卷';
      paperSub.textContent = '点击左侧「选择试卷」开始考试';
      questionsContainer.innerHTML = `<div class="empty-paper"><span>📋</span><div>暂无试卷，请从左侧选择</div></div>`;
      cardPaperName.textContent = '未选择';
      return;
    }

    paperTitle.textContent = currentPaper.name;
    paperSub.textContent = currentPaper.description;
    cardPaperName.textContent = currentPaper.name;

    const answers = userAnswers[currentPaper.id] || {};
    let html = '';

    currentQuestions.forEach(q => {
      const saved = answers[q.id];
      html += `<div class="question-item" data-qid="${q.id}">`;
      html += `<div class="q-header"><span class="q-index">第 ${q.displayId} 题</span><span class="q-text">${q.text}</span></div>`;

      if (q.type === 'single' || q.type === 'judge') {
        html += `<div class="options">`;
        q.options.forEach((opt, idx) => {
          const checked = (saved === idx) ? 'checked' : '';
          const radioName = `q_${currentPaper.id}_${q.id}`;
          html += `<div class="option"><input type="radio" name="${radioName}" value="${idx}" id="opt_${currentPaper.id}_${q.id}_${idx}" ${checked} data-qid="${q.id}" data-optindex="${idx}" data-type="${q.type}"><label for="opt_${currentPaper.id}_${q.id}_${idx}">${String.fromCharCode(65+idx)}. ${opt}</label></div>`;
        });
        html += `</div>`;
      } else if (q.type === 'multiple') {
        html += `<div class="options">`;
        const savedArr = Array.isArray(saved) ? saved : [];
        q.options.forEach((opt, idx) => {
          const checked = savedArr.includes(idx) ? 'checked' : '';
          const checkId = `chk_${currentPaper.id}_${q.id}_${idx}`;
          html += `<div class="option"><input type="checkbox" id="${checkId}" value="${idx}" ${checked} data-qid="${q.id}" data-optindex="${idx}" data-type="multiple"><label for="${checkId}">${String.fromCharCode(65+idx)}. ${opt}</label></div>`;
        });
        html += `</div>`;
      }

      if (q.explanation) {
        html += `<div class="explain"><strong>解析：</strong>${q.explanation}</div>`;
      }
      html += `</div>`;
    });

    questionsContainer.innerHTML = html;

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (isSubmitted) return;
        const qid = parseInt(e.target.dataset.qid);
        const optIndex = parseInt(e.target.dataset.optindex);
        const type = e.target.dataset.type;
        handleAnswerSelect(currentPaper.id, qid, optIndex, type);
      });
    });

    document.querySelectorAll('input[type="checkbox"]').forEach(chk => {
      chk.addEventListener('change', (e) => {
        if (isSubmitted) return;
        const qid = parseInt(e.target.dataset.qid);
        const checked = [];
        document.querySelectorAll(`input[data-qid="${qid}"][data-type="multiple"]`).forEach(cb => {
          if (cb.checked) checked.push(parseInt(cb.dataset.optindex));
        });
        handleAnswerSelect(currentPaper.id, qid, checked.sort(), 'multiple');
      });
    });

    if (activeQuestionId) {
      const exists = currentQuestions.some(q => q.id === activeQuestionId);
      if (!exists) activeQuestionId = null;
    }
    updateActiveQuestionHighlight();
  }

  function renderResultContent() {
    if (!currentPaper) return;
    paperTitle.textContent = `${currentPaper.name} · 答题结果`;
    const totalScore = currentQuestions.length * 0.5;
    const passScore = 60;
    const status = score >= passScore ? 'pass' : 'fail';
    const statusText = score >= passScore ? '及格' : '不及格';

    let html = `<div class="score-banner">
      <div><span class="score-label">总分</span> <span class="total-score ${status}">${score.toFixed(1)}</span> <span class="score-label">/ ${totalScore.toFixed(1)}</span></div>
      <div class="result-status ${status}">${statusText}</div>
    </div>`;

    // 重新答题和重新选试卷按钮
    html += `<div class="result-actions">
      <button class="retry-btn" id="retryBtn">🔄 重新答题</button>
      <button class="reselect-btn" id="reselectBtn">📄 重新选试卷</button>
    </div>`;

    const answers = userAnswers[currentPaper.id] || {};

    currentQuestions.forEach(q => {
      const userAns = answers[q.id];
      const correct = isAnswerCorrect(q, userAns);
      html += `<div class="question-item" data-qid="${q.id}">`;
      html += `<div class="q-header"><span class="q-index">第 ${q.displayId} 题</span><span class="q-text">${q.text}</span></div>`;

      let userAnswerStr = '未作答';
      let correctAnswerStr = '';

      if (q.type === 'single' || q.type === 'judge') {
        if (userAns !== undefined) {
          userAnswerStr = `${String.fromCharCode(65+userAns)}. ${q.options[userAns]}`;
        }
        correctAnswerStr = `${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}`;
      } else if (q.type === 'multiple') {
        if (Array.isArray(userAns) && userAns.length > 0) {
          userAnswerStr = userAns.map(i => `${String.fromCharCode(65+i)}. ${q.options[i]}`).join('； ');
        }
        correctAnswerStr = q.answer.map(i => `${String.fromCharCode(65+i)}. ${q.options[i]}`).join('； ');
      }

      html += `<div class="result-section">
        <div class="result-row">
          <div class="result-item"><span class="result-label">你的答案：</span><span class="result-value ${correct ? 'correct' : 'wrong'}">${userAnswerStr}</span></div>
          <div class="result-item"><span class="result-label">标准答案：</span><span class="result-value correct">${correctAnswerStr}</span></div>
          <div class="result-item"><span class="result-label">结果：</span><span class="result-value ${correct ? 'correct' : 'wrong'}">${correct ? '✔ 正确' : '✘ 错误'}</span></div>
        </div>
        <div class="result-options">`;
      if (q.type === 'single' || q.type === 'judge') {
        q.options.forEach((opt, idx) => {
          let cls = '';
          if (idx === q.answer) cls = 'correct-opt';
          if (userAns === idx && idx !== q.answer) cls = 'wrong-opt';
          if (userAns === idx && idx === q.answer) cls = 'correct-opt';
          html += `<span class="${cls}">${String.fromCharCode(65+idx)}. ${opt}</span>`;
        });
      } else if (q.type === 'multiple') {
        q.options.forEach((opt, idx) => {
          let cls = '';
          const isCorrect = q.answer.includes(idx);
          const isSelected = Array.isArray(userAns) && userAns.includes(idx);
          if (isCorrect) cls = 'correct-answer';
          if (isSelected && !isCorrect) cls = 'wrong-opt';
          if (isSelected && isCorrect) cls = 'correct-opt selected-opt';
          html += `<span class="${cls}">${String.fromCharCode(65+idx)}. ${opt}</span>`;
        });
      }
      html += `</div></div>`;

      if (q.explanation) {
        html += `<div class="explain"><strong>解析：</strong>${q.explanation}</div>`;
      }
      html += `</div>`;
    });

    html += `<label class="no-highlight-check"><input type="checkbox" id="noHighlightCheck" ${noHighlight ? 'checked' : ''}> 跳转不高亮（1秒后恢复）</label>`;

    questionsContainer.innerHTML = html;

    // 绑定结果页按钮
    const retryBtn = document.getElementById('retryBtn');
    const reselectBtn = document.getElementById('reselectBtn');
    if (retryBtn) {
      retryBtn.addEventListener('click', () => {
        // 重新答题：保留当前试卷，清空答案
        if (!currentPaper) return;
        isSubmitted = false;
        score = 0;
        activeQuestionId = null;
        userAnswers[currentPaper.id] = {};
        if (randomMode) {
          currentQuestions = shuffleAndRenumber(currentPaper.questions);
        } else {
          currentQuestions = renumber(currentPaper.questions);
        }
        selectPaperBtn.style.display = 'block';
        actionBtns.style.display = 'flex';
        randomCheckWrap.style.display = 'block';
        historySection.style.display = 'none';
        updateStats();
        renderQuestionButtons();
        renderPaperContent();
      });
    }
    if (reselectBtn) {
      reselectBtn.addEventListener('click', () => {
        // 重新选试卷：回到初始状态
        isSubmitted = false;
        score = 0;
        activeQuestionId = null;
        currentPaper = null;
        currentQuestions = [];
        selectPaperBtn.style.display = 'block';
        actionBtns.style.display = 'none';
        randomCheckWrap.style.display = 'none';
        historySection.style.display = 'none';
        paperTitle.textContent = '请选择试卷';
        paperSub.textContent = '点击左侧「选择试卷」开始考试';
        questionsContainer.innerHTML = `<div class="empty-paper"><span>📋</span><div>暂无试卷，请从左侧选择</div></div>`;
        cardPaperName.textContent = '未选择';
        updateStats();
        renderQuestionButtons();
        // 自动弹出选择试卷弹窗
        showModal();
      });
    }

    const noHighlightCheck = document.getElementById('noHighlightCheck');
    if (noHighlightCheck) {
      noHighlightCheck.addEventListener('change', (e) => {
        noHighlight = e.target.checked;
      });
    }

    document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(el => {
      el.disabled = true;
    });
  }

  function calculateScore() {
    if (!currentPaper) return 0;
    const answers = userAnswers[currentPaper.id] || {};
    let s = 0;
    currentQuestions.forEach(q => {
      if (isAnswerCorrect(q, answers[q.id])) s += 0.5;
    });
    return s;
  }

  function submitPaper() {
    if (!currentPaper || isSubmitted) return;
    isSubmitted = true;
    score = calculateScore();
    const record = {
      paperName: currentPaper.name,
      score: score,
      total: currentQuestions.length * 0.5,
      time: new Date().toLocaleString()
    };
    historyRecords.unshift(record);
    if (historyRecords.length > 6) historyRecords.pop();
    renderResultContent();
    renderQuestionButtons();
    actionBtns.style.display = 'none';
    randomCheckWrap.style.display = 'none';
    selectPaperBtn.style.display = 'none';
    historySection.style.display = 'block';
    renderHistory();
    activeQuestionId = null;
    updateActiveQuestionHighlight();
  }

  function resetPaper() {
    if (!currentPaper) return;
    userAnswers[currentPaper.id] = {};
    isSubmitted = false;
    score = 0;
    activeQuestionId = null;
    if (randomMode) {
      currentQuestions = shuffleAndRenumber(currentPaper.questions);
    } else {
      currentQuestions = renumber(currentPaper.questions);
    }
    selectPaperBtn.style.display = 'block';
    actionBtns.style.display = 'flex';
    randomCheckWrap.style.display = 'block';
    historySection.style.display = 'none';
    updateStats();
    renderQuestionButtons();
    renderPaperContent();
    activeQuestionId = null;
    updateActiveQuestionHighlight();
  }

  function renderHistory() {
    if (historyRecords.length === 0) {
      historyList.innerHTML = '<div style="padding:12px;color:#7a8aa3;font-size:13px;text-align:center;">暂无历史成绩</div>';
      return;
    }
    let html = '';
    historyRecords.forEach(r => {
      const pass = r.score >= 60;
      html += `<div class="history-item">
        <span>${r.paperName}</span>
        <span><span class="score ${pass ? 'pass' : 'fail'}">${r.score.toFixed(1)}</span> / ${r.total.toFixed(1)}</span>
        <span style="color:#7a8aa3;font-size:12px;">${r.time}</span>
      </div>`;
    });
    html += `<div class="clear-history" id="clearHistoryBtn">清除历史记录</div>`;
    historyList.innerHTML = html;
    document.getElementById('clearHistoryBtn')?.addEventListener('click', () => {
      historyRecords = [];
      renderHistory();
    });
  }

  function loadPaper(paperId) {
    const paper = papers.find(p => p.id === paperId);
    if (!paper) return;
    isSubmitted = false;
    score = 0;
    activeQuestionId = null;
    currentPaper = paper;
    if (randomMode) {
      currentQuestions = shuffleAndRenumber(paper.questions);
    } else {
      currentQuestions = renumber(paper.questions);
    }
    initAnswersForPaper(paperId);
    selectPaperBtn.style.display = 'block';
    actionBtns.style.display = 'flex';
    randomCheckWrap.style.display = 'block';
    historySection.style.display = 'none';
    updateStats();
    renderQuestionButtons();
    renderPaperContent();
  }

  function showModal() {
    let listHtml = '';
    papers.forEach(paper => {
      listHtml += `<div class="paper-option" data-paperid="${paper.id}"><span>${paper.name}</span><span class="badge">${paper.questions.length} 题</span></div>`;
    });
    paperList.innerHTML = listHtml;
    document.querySelectorAll('.paper-option').forEach(opt => {
      opt.addEventListener('click', (e) => {
        const paperId = opt.dataset.paperid;
        loadPaper(paperId);
        modalOverlay.classList.remove('show');
      });
    });
    modalOverlay.classList.add('show');
  }

  function hideModal() { modalOverlay.classList.remove('show'); }
  function hideConfirm() { confirmOverlay.classList.remove('show'); }

  // 事件绑定
  selectPaperBtn.addEventListener('click', showModal);
  closeModalBtn.addEventListener('click', hideModal);
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) hideModal(); });

  submitBtn.addEventListener('click', () => {
    if (!currentPaper || isSubmitted) return;
    confirmOverlay.classList.add('show');
  });
  cancelSubmitBtn.addEventListener('click', hideConfirm);
  confirmSubmitBtn.addEventListener('click', () => {
    hideConfirm();
    submitPaper();
  });
  confirmOverlay.addEventListener('click', (e) => { if (e.target === confirmOverlay) hideConfirm(); });

  resetBtn.addEventListener('click', () => {
    if (!currentPaper) return;
    if (isSubmitted) {
      isSubmitted = false;
      selectPaperBtn.style.display = 'block';
      actionBtns.style.display = 'flex';
      randomCheckWrap.style.display = 'block';
      historySection.style.display = 'none';
    }
    resetPaper();
  });

  randomCheck.addEventListener('change', (e) => {
    randomMode = e.target.checked;
    if (currentPaper && !isSubmitted) {
      if (randomMode) {
        currentQuestions = shuffleAndRenumber(currentPaper.questions);
      } else {
        currentQuestions = renumber(currentPaper.questions);
      }
      updateStats();
      renderQuestionButtons();
      renderPaperContent();
    }
  });

  questionGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('.question-btn');
    if (!btn) return;
    const qid = parseInt(btn.dataset.qid);
    if (!currentPaper) return;
    scrollToQuestion(qid);
  });

  historyHeader.addEventListener('click', () => {
    historyVisible = !historyVisible;
    historyList.classList.toggle('open', historyVisible);
    historyArrow.classList.toggle('open', historyVisible);
  });

  // 初始化
  (function init() {
    currentPaper = null;
    currentQuestions = [];
    activeQuestionId = null;
    isSubmitted = false;
    updateStats();
    renderQuestionButtons();
    renderPaperContent();
    randomCheck.checked = false;
    randomMode = false;
    historySection.style.display = 'none';
  })();

        { id:30, type:'single', text:'建筑设有上下层连通的中庭、走马廊、敞开楼梯、自动扶梯时，其连通部位的顶棚、墙面应采用（）级装修材料。（A）', options:['A','A1','B','B1'], answer:0, explanation:'应采用A级装修材料。' },
        { id:31, type:'single', text:'在位图信息显示下，G为气体灭火，B为（），S为声光警报。（C）', options:['声光警报','压力开关','消防广播','模块类型'], answer:2, explanation:'B为消防广播。' },
        { id:32, type:'single', text:'Ctrl+C执行复制命令，（）执行粘贴命令。（D）', options:['Ctrl+A','Ctrl+F','Ctrl+D','Ctrl+V'], answer:3, explanation:'Ctrl+V执行粘贴命令。' },
        { id:33, type:'single', text:'右键单击"此电脑"，在快捷菜单中单击（）按钮，可查看系统属性。（D）', options:['设置','控制面板','账户','属性'], answer:3, explanation:'单击属性可查看系统属性。' },
        { id:34, type:'single', text:'当被探测线路在1s内发生14个及以上半周期的故障电弧时，故障电弧探测器应能在（）s内发出报警信号。（B）', options:['10','30','40','3'], answer:1, explanation:'故障电弧探测器应能在30s内发出报警信号。' },
        { id:35, type:'single', text:'根据系统的（）情况，自动喷水灭火系统又可分为湿式系统、干式系统、预作用系统、重复启闭预作用系统、防护冷却系统、雨淋系统、水幕系统等。（D）', options:['用途','配置','结构形式','用途和配置'], answer:3, explanation:'根据系统的用途和配置情况进行分类。' },
        { id:36, type:'single', text:'由供水装置、过滤装置、控制阀、细水雾喷头等组件和供水管道组成，能自动和人工启动并喷放细水雾进行灭火或控火的自动灭火系统是（）。（A）', options:['细水雾灭火系统','水喷雾系统','雨淋系统','泡沫一水喷淋灭火系统'], answer:0, explanation:'该系统是细水雾灭火系统。' },
        { id:37, type:'single', text:'单独建造的消防控制室，耐火等级不应低于（）。（B）', options:['一级','二级','三级','四级'], answer:1, explanation:'耐火等级不应低于二级。' },
        { id:38, type:'single', text:'飞机发动机试验台的试车部位宜设（）。（D）', options:['雨淋系统','泡沫一水喷淋灭火系统','细水雾灭火系统','水喷雾灭火系统'], answer:3, explanation:'宜设水喷雾灭火系统。' },
        { id:39, type:'single', text:'关闭电气火灾监控设备备用电源，电气火灾监控设备处于（）状态。（B）', options:['主、备电源故障','主电工作，备电故障','主备电同时工作','主电故障、备电工作'], answer:1, explanation:'处于主电工作，备电故障状态。' },
        { id:40, type:'single', text:'集中报警系统中的火灾报警控制器、消防联动控制器和消防联动控制设备均处于自动控制方式，则整个系统处于（）控制状态。（A）', options:['自动','手动','联动','联锁'], answer:0, explanation:'整个系统处于自动控制状态。' },
        { id:41, type:'single', text:'按下快捷键（）键，即执行"剪切"命令。（C）', options:['Ctrl+C','Ctrl+V','Ctrl+X','Ctrl+F'], answer:2, explanation:'Ctrl+X执行"剪切"命令。' },
        { id:42, type:'single', text:'Q是指电流流过导体产生的热量，与电流的（）、导体电阻及通电时间成正比。（B）', options:['1次方','平方','3次方','4次方'], answer:1, explanation:'与电流的平方成正比。' },
        { id:43, type:'single', text:'在串联电路中，各电阻分得的电压与其阻值成（）。（A）', options:['正比','反比','之和','相等'], answer:0, explanation:'电压与阻值成正比。' },
        { id:44, type:'single', text:'常用的A4纸尺寸为（）厘米。（A）', options:['21×29.7','22×30','22×29','21×29'], answer:0, explanation:'A4纸尺寸为21×29.7厘米。' },
        { id:45, type:'single', text:'核电站的消防工作属于（）监督管理。（D）', options:['当地消防救援机构','地方各级人民政府','县级以上人民政府','主管单位'], answer:3, explanation:'核电站的消防工作由其主管单位监督管理。' },
        { id:46, type:'single', text:'在串联电路中，总电阻等于分电阻（）。（D）', options:['相等','成正比','成反比','之和'], answer:3, explanation:'总电阻等于分电阻之和。' },
        { id:47, type:'single', text:'可燃气体探测报警系统由可燃气体报警控制器、可燃气体探测器、火灾声光警报器组成，能够在保护区域内泄漏可燃气体的浓度低于（）的条件下提前报警。（D）', options:['爆炸上限','爆炸范围','平均值','爆炸下限'], answer:3, explanation:'在浓度低于爆炸下限的条件下提前报警。' },
        { id:48, type:'single', text:'火灾显示盘当采用壁挂式方式安装时，其底边距地高度宜为（）m。（D）', options:['1~1.3','1~1.5','1.1~1.5','1.3~1.5'], answer:3, explanation:'底边距地高度宜为1.3~1.5m。' },
        { id:49, type:'single', text:'火灾报警控制器主电工作指示灯（）点亮控制器由AC220V电源供电工作。（B）', options:['红色','绿色','黄色','DC220V'], answer:1, explanation:'主电工作指示灯绿色点亮。' },
        { id:50, type:'single', text:'火灾的水平蔓延速度快、闭式喷头的开放不能及时使喷水有效覆盖着火区域的场所宜设置（）。（A）', options:['雨淋系统','湿式系统','预作用系统','重复启闭预作用'], answer:0, explanation:'宜设置雨淋系统。' },
        { id:51, type:'single', text:'可燃气体探测器探测到可燃气体浓度值（）相应报警浓度设定值时，控制器面板上相应的可燃气体探测器红色报警灯常亮，蜂鸣器长鸣，系统发出声光报警信号。（A）', options:['大于或等于','等于','小于','大于'], answer:0, explanation:'浓度值大于或等于设定值时发出报警。' },
        { id:52, type:'single', text:'集中火灾报警控制器点击"（）"图标，显示出火警监管信息。（C）', options:['历史记录','分类查看','火警监管','联动信息'], answer:2, explanation:'点击"火警监管"图标。' },
        { id:53, type:'single', text:'Internet属于一种（）。（A）', options:['广域网','局域网','城域网','政务网'], answer:0, explanation:'Internet属于广域网。' },
        { id:54, type:'single', text:'附设在建筑内的消防控制室、灭火设备室、消防水泵房和通风空气调节机房、变配电室等，应采用耐火极限不低于（）h的防火隔墙。（A）', options:['2','3','4','5'], answer:0, explanation:'耐火极限不低于2h。' },
        { id:55, type:'single', text:'必须迅速扑救初期火灾的场所适合安装（）。（C）', options:['湿式系统','干式系统','雨淋系统','水幕系统'], answer:2, explanation:'适合安装雨淋系统。' },
        { id:56, type:'single', text:'产品经保养接入系统后，应按规定进行接入（），检查结果应符合产品标准和设计要求。（B）', options:['出厂检测','复检','例行检查','反复检查'], answer:1, explanation:'应进行接入复检。' },
        { id:57, type:'single', text:'机械加压送风系统的风道应采用（）材料制作。（B）', options:['难燃','不燃','易燃','可燃'], answer:1, explanation:'应采用不燃材料制作。' },
        { id:58, type:'single', text:'蛋白泡沫灭火剂由含蛋白的原料经部分水解制成，是一种（）的黏稠液体。（A）', options:['黑褐色','黄色','奶白色','青绿色'], answer:0, explanation:'是一种黑褐色的黏稠液体。' },
        { id:59, type:'single', text:'环境温度低于4℃或高于70℃的场所应安装（）。（A）', options:['干式系统','湿式系统','水幕系统','雨淋系统'], answer:0, explanation:'应安装干式系统。' },
        { id:60, type:'single', text:'在燃烧反应过程中，如果生成的燃烧产物不能再燃烧，称为（）产物。（A）', options:['完全燃烧','不完全燃烧','充分燃烧','猛烈燃烧'], answer:0, explanation:'称为完全燃烧产物。' },
        { id:61, type:'single', text:'打开"控制面板"，单击"硬件和声音"，单击"鼠标"按钮，在弹出的"（）"对话框中，可使用"鼠标键"选项卡切换左右键功能。（A）', options:['鼠标属性','鼠标键','菜单','任务栏'], answer:0, explanation:'弹出"鼠标属性"对话框。' },
        { id:62, type:'single', text:'焦炭的燃烧属于（）。（C）', options:['蒸发燃烧','分解燃烧','表面燃烧','沸溢燃烧'], answer:2, explanation:'焦炭的燃烧属于表面燃烧。' },
        { id:63, type:'single', text:'风机正常启动（）应点亮。（A）', options:['运行灯','指示灯','故障灯','巡检灯'], answer:0, explanation:'运行灯应点亮。' },
        { id:64, type:'single', text:'用砖（石）做承重墙，用木材做楼板、屋架的建筑，属于（）建筑。（B）', options:['木结构','砖木结构','砖混结构建筑','钢筋混凝土结构'], answer:1, explanation:'属于砖木结构建筑。' },
        { id:65, type:'single', text:'在空气中遇明火或高温作用时，不起火、不燃烧、不炭化的建筑材料属于（）。（A）', options:['不燃材料','难燃材料','可燃材料','易燃材料'], answer:0, explanation:'属于不燃材料。' },
        { id:66, type:'single', text:'计算机软件按照使用功能，一般分为（）和应用软件两大类。（B）', options:['办公软件','系统软件','游戏软件','后台软件'], answer:1, explanation:'分为系统软件和应用软件。' },
        { id:67, type:'single', text:'在规定的实验条件下，可燃性液体表面产生的蒸汽在试验火焰作用下发生闪燃的最低温度称为（）。（A）', options:['闪点','燃点','自燃点','自燃'], answer:0, explanation:'称为闪点。' },
        { id:68, type:'single', text:'火灾现场的保护时间应从（）起，到火灾现场勘验结束为止。（B）', options:['发现火灾前','发现火灾时','发现火灾后','扑救火灾时'], answer:1, explanation:'从发现火灾时起。' },
        { id:69, type:'single', text:'CPU的性能主要取决于它在每个时钟周期内处理数据的能力和时钟频率，位数越（），处理能力越（）；频率越高，处理速度越（）。（A）', options:['多、强、快','少、强、满','多、弱、快','少、弱、慢'], answer:0, explanation:'位数越多，处理能力越强；频率越高，处理速度越快。' },
        { id:70, type:'single', text:'查看可燃气体报警控制器的报警信息有（）种方式。（B）', options:['1','2','3','4'], answer:1, explanation:'有2种方式。' },
        { id:71, type:'single', text:'可以通过查看集中控制器显示屏的信息列表，通过列表上的火警信息，可直接查看（）。（D）', options:['编号和部位','报警地点和部位','编号和类型','编号和报警地点'], answer:3, explanation:'可直接查看编号和报警地点。' },
        { id:72, type:'single', text:'根据《中华人民共和国职业分类大典（2022年版）》，将我国职业分为（）大类。（D）', options:['5','6','7','8'], answer:3, explanation:'分为8大类。' },
        { id:73, type:'single', text:'在湿式和干式自动喷水灭火系统中，（）担负着探测火灾、启动系统和喷水灭火的任务。（B）', options:['开式喷头','闭式喷头','水流指示器','火灾探测器'], answer:1, explanation:'闭式喷头担负此任务。' },
        { id:74, type:'single', text:'过负载保护电器的动作特性应保证保护电器可靠动作的电流小于等于（）倍熔断器熔体额定电流。（D）', options:['1.05','1.15','1.25','1.45'], answer:3, explanation:'小于等于1.45倍。' },
        { id:75, type:'single', text:'公民道德建设要做到（）个坚持。（D）', options:['2','3','4','6'], answer:3, explanation:'要做到6个坚持。' },
        { id:76, type:'single', text:'公称动作温度为68℃的玻璃喷头，其工作液色标为（）。（B）', options:['绿色','红色','蓝色','紫色'], answer:1, explanation:'色标为红色。' },
        { id:77, type:'single', text:'（）打印机一般应用于发票打印。（A）', options:['针式','3D','喷墨','激光'], answer:0, explanation:'针式打印机一般应用于发票打印。' },
        { id:78, type:'single', text:'（）是对从事某一职业所具备的学识、技术、能力的基本要求。（D）', options:['职业水平','职业能力','职业素养','职业资格'], answer:3, explanation:'职业资格是对从事某一职业所具备的学识、技术、能力的基本要求。' },
        { id:79, type:'single', text:'环境温度不低于4℃且不高于70℃的场所适合安装（）。（A）', options:['湿式系统','干式系统','雨淋系统','水幕系统'], answer:0, explanation:'适合安装湿式系统。' },
        { id:80, type:'single', text:'公民道德建设有（）项重点任务。（B）', options:['3','4','5','11'], answer:1, explanation:'有4项重点任务。' },
        { id:81, type:'single', text:'不能使用防火墙分隔的开口部位宜设置（）。（C）', options:['干式系统','湿式系统','水幕系统','雨淋系统'], answer:2, explanation:'宜设置水幕系统。' },
        { id:82, type:'single', text:'在位图信息显示下，P为压力开关，W为（），D为楼层显示器。（C）', options:['声光警报','压力开关','水流指示器','模块类型'], answer:2, explanation:'W为水流指示器。' },
        { id:83, type:'single', text:'接通应急照明控制器电源，打开控制器电源的主备电开关，控制器进入系统（）状态。（B）', options:['正常监控','自检','主电工作','备电工作'], answer:1, explanation:'控制器进入系统自检状态。' },
        { id:84, type:'single', text:'（）是指从事一定职业劳动的人们，在特定的工作和劳动中以其内心信念和特殊手段来维系的，以善恶进行评价的心理意识、行为原则和行为规范的总和。（A）', options:['职业道德','职业作风','职业资格','职业荣誉'], answer:0, explanation:'该定义是职业道德。' },
        { id:85, type:'single', text:'（）是从事建（构）筑物消防设施运行、操作和维修、保养、检测等工作的人员。（A）', options:['消防设施操作员','消防员','消防安全管理员','建（构）筑物消防员'], answer:0, explanation:'消防设施操作员从事上述工作。' },
        { id:86, type:'single', text:'当采用与火灾自动报警系统联动启动时，自动排烟窗应在（）内或小于烟气充满储烟仓时间内开启完毕。（D）', options:['10S','15S','30s','60s'], answer:3, explanation:'应在60s内开启完毕。' },
        { id:87, type:'single', text:'（）是指以高度负责的职业道德精神，在本岗位上尽职尽责，时刻做好为消防事业献出生命的准备。（D）', options:['爱岗敬业','临危不乱','精益求精','忠于职守'], answer:3, explanation:'该定义是忠于职守。' },
        { id:88, type:'single', text:'操作火灾自动报警系统总线手动控制单元的启动按键，在集中控制器上按下总线手动控制单元上相应（）的控制按钮。（B）', options:['控制设备','联动设备','报警设备','灭火设备'], answer:1, explanation:'按下相应联动设备的控制按钮。' },
        { id:89, type:'single', text:'防排烟风机（）保养一次。（C）', options:['每年','每半年','每季度','每月'], answer:2, explanation:'防排烟风机每季度保养一次。' },
        { id:90, type:'single', text:'工业及商业用途点型可燃气体探测器按采样方式分类，不包含以下哪个（）。（C）', options:['自由扩散式探测器','吸气式探测器','独立式探测器','光纤传感式探测器'], answer:2, explanation:'独立式探测器是按工作方式分类，不是按采样方式。' },
        { id:91, type:'single', text:'可燃气体从喷口喷出，在喷口处与空气中的氧边扩散混合、边燃烧的现象，称为（）。（D）', options:['蒸发燃烧','分解燃烧','表面燃烧','扩散燃烧'], answer:3, explanation:'称为扩散燃烧。' },
        { id:92, type:'single', text:'采用泡沫灭火，将泡沫覆盖于燃烧液体或固体的表面，在冷却作用的同时，起到将可燃物与空气（）的作用。（B）', options:['覆盖','隔离','乳化','窒息'], answer:1, explanation:'起到隔离的作用。' },
        { id:93, type:'single', text:'感光火灾探测器又称为（）。（A）', options:['火焰探测器','红外光束感烟探测器','缆式线型火灾探测器','点型火灾探测器'], answer:0, explanation:'感光火灾探测器又称为火焰探测器。' },
        { id:94, type:'single', text:'火灾报警控制器（联动型）（）每个操作按钮对应一个控制输出，控制喷淋泵组、消火栓泵组、防烟和排烟风机等消防设备的启动。（B）', options:['总线控制盘','多线控制盘','智能手动盘','控制模块'], answer:1, explanation:'多线控制盘每个操作按钮对应一个控制输出。' },
        { id:95, type:'single', text:'（）打印机打印照片效果好，成本低。（C）', options:['针式','激光','喷墨','热敏'], answer:2, explanation:'喷墨打印机打印照片效果好、成本低。' },

        { id:149, type:'judge', text:'A类火灾场所可以配置BC干粉（碳酸氢钠）灭火器。（错）', options:['对','错'], answer:1, explanation:'BC干粉灭火器不能用于A类火灾，应使用ABC干粉灭火器。' },
        { id:150, type:'judge', text:'避难走道内部装修材料的燃烧性能应为A级。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:151, type:'judge', text:'胶合板属于B2级材料。（对）', options:['对','错'], answer:0, explanation:'胶合板属于普通可燃材料，为B2级。' },
        { id:152, type:'judge', text:'闭式细水雾灭火系统的工作原理与闭式自动喷水灭火系统相同。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:153, type:'judge', text:'excel2010在"开始"功能区的"显示"子功能区中，可对工作簿中的文字字体、字号、颜色等进行编辑。（错）', options:['对','错'], answer:1, explanation:'应在"字体"子功能区中进行编辑。' },
        { id:154, type:'judge', text:'保护对象为1000V以上的供电线路，宜选择接触式测温电气火灾监控探测器。（错）', options:['对','错'], answer:1, explanation:'1000V及以下的配电线路采用接触式布置。' },
        { id:155, type:'judge', text:'室内消火栓栓口的静压不应大于1.0MPa，超过则应采取分区供水措施；栓口动压不应大于0.50MPa，当大于0.70MPa时必须设置减压装置。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:156, type:'judge', text:'烟囱效应是造成烟气向上蔓延的主要因素。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:157, type:'judge', text:'当发现线型光束感烟火灾探测器的发射、接收窗口及反射器表面被灰尘或者油污污染，可以使用水及其他化学药剂除污。（错）', options:['对','错'], answer:1, explanation:'不要使用水及其他化学药剂除污。' },
        { id:158, type:'judge', text:'建筑与储罐、堆场的防火间距，为建筑外墙至储罐外壁或堆场中相邻堆垛外缘的最近水平距离。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:159, type:'judge', text:'建筑之间的防火间距应保证任意一侧建筑外墙受到的相邻建筑火灾辐射热强度均低于其临界引燃辐射热强度。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:160, type:'judge', text:'避难走道防火隔墙的耐火极限不应低于3.00h。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:161, type:'judge', text:'不同的可燃物有不同的自燃点，同一种可燃物在不同的条件下自燃点不会发生变化。（错）', options:['对','错'], answer:1, explanation:'同一种可燃物在不同条件下自燃点不同。' },
        { id:162, type:'judge', text:'在火灾多发季节或有重大活动保卫任务的单位，应组织全要素综合演练，宜每月组织开展一次疏散演练。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:163, type:'judge', text:'从首层到第一个避难层之间及两个避难层之间的高度不应大于50m。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:164, type:'judge', text:'使用推车式灭火器扑救可燃液体火灾时，应避免灭火剂直接冲击燃烧液面，防止可燃液体流散扩大火势。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:165, type:'judge', text:'在图形显示装置的平面图下方显示有各种状态信息，包括火警、监管、反馈、联动、屏蔽、故障、信息传输、主电、备电等信息。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:166, type:'judge', text:'特级防火卷帘可以应用于防火分隔部位，也可代替防火墙或防火隔墙。（错）', options:['对','错'], answer:1, explanation:'只能局部代替，不能完全代替。' },
        { id:167, type:'judge', text:'按下delete键，原有位置的文件消失，被放到回收站。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:168, type:'judge', text:'所谓程序，就是为解决某一问题而设计的一系列有序的指令或语句的集合。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:169, type:'judge', text:'延长工作时间的劳动者有权获得相应的报酬或安排补休。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:170, type:'judge', text:'有大量粉尘、水雾滞留的场所宜选择线型光束感烟火灾探测器。（错）', options:['对','错'], answer:1, explanation:'不宜选择线型光束感烟火灾探测器。' },
        { id:171, type:'judge', text:'保养工作完成后，保养人员需要仔细检查并确保没有异物落入且遗留在机柜（壳）内、电器元件及线路中，检查完成后方可上电。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:172, type:'judge', text:'水塔内部专业人员可以进入施工作业，所以水塔属于建筑物。（错）', options:['对','错'], answer:1, explanation:'水塔属于构筑物。' },
        { id:173, type:'judge', text:'建筑占地面积大于300㎡的厂房和仓库应设置室内消火栓。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:174, type:'judge', text:'预应力钢筋混凝土构件的耐火极限远高于现浇钢筋混凝土构件。（错）', options:['对','错'], answer:1, explanation:'预应力钢筋混凝土构件的耐火极限远低于现浇钢筋混凝土构件。' },
        { id:175, type:'judge', text:'建筑内设置消防电梯时，每个防火分区可供使用的消防电梯不应少于1部。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:176, type:'judge', text:'水喷雾灭火系统可用于扑救电气火灾。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:177, type:'judge', text:'接收到监管报警信号后，集中控制器的声信号与火灾报警声信号有区别，通常可独立设置监管声报警类型，也可选用故障声报警类型。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:178, type:'judge', text:'水喷雾灭火系统不得用于扑救遇水能发生化学反应造成燃烧的火灾。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:179, type:'judge', text:'TN系统就是电源中性点直接接地，电气设备外壳与中性点相连的保护接零系统。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:180, type:'judge', text:'建筑高度大于24m的公共建筑归属为一类高层民用建筑。（错）', options:['对','错'], answer:1, explanation:'建筑高度大于50m的公共建筑为一类高层民用建筑。' },
        { id:181, type:'judge', text:'在供水初期，由于消火栓泵启动需要一定时间，其初期供水由消防水池来完成。（错）', options:['对','错'], answer:1, explanation:'初期供水由高位消防水箱来完成。' },
        { id:182, type:'judge', text:'凡遇水能发生燃烧和爆炸的物质，不能用水进行扑救。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:183, type:'judge', text:'感抗用字母Xc表示，单位是Ω。（错）', options:['对','错'], answer:1, explanation:'感抗用字母XL表示。' },
        { id:184, type:'judge', text:'严守规程是指严格按照国家消防安全的方针、政策、法律、条例、标准、规程和有关制度等进行操作。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:185, type:'judge', text:'按照火灾事故所造成的灾害损失程度，火灾分为重大火灾、较大火灾和一般火灾3个等级。（错）', options:['对','错'], answer:1, explanation:'分为特别重大火灾、重大火灾、较大火灾和一般火灾4个等级。' },
        { id:186, type:'judge', text:'串联电路的两端电压相等。（错）', options:['对','错'], answer:1, explanation:'串联电路总电压等于分电压之和。' },
        { id:187, type:'judge', text:'在消防控制室进行总机与所有的电话分机、电话插孔之间互相呼叫与通话，呼叫铃声，通话应语音清晰无振鸣。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:188, type:'judge', text:'多线制控制盘也称作多线制手动控制盘或直接手动控制盘。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:189, type:'judge', text:'建筑高度为30m的住宅楼应设置消防电梯。（错）', options:['对','错'], answer:1, explanation:'建筑高度大于33m的住宅建筑才需要设置消防电梯。' },
        { id:190, type:'judge', text:'接通电源后，集中火灾报警控制器根据系统状况可以发出火警、联动、监管、屏蔽和故障报警等信号。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:191, type:'judge', text:'举办大型群众性活动，承办人无需制定灭火和应急疏散预案并组织演练。（错）', options:['对','错'], answer:1, explanation:'承办人应当制定灭火和应急疏散预案并组织演练。' },
        { id:192, type:'judge', text:'干式自动喷水灭火系统由于在准工作状态时配水管道内充满用于启动系统的有压气体，因此还应设置充气和气压维持装置。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:193, type:'judge', text:'将拆卸的火灾探测器探头重新安装到底座上，火灾报警控制器和火灾显示盘应恢复正常监视状态。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:194, type:'judge', text:'TN-C系统中保护零线和工作零线在整个系统中是共用的。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:195, type:'judge', text:'延迟器安装在湿式报警阀组的报警管路上，是可最大限度减少因水源压力波动或冲击而造成误报警的一种容积式装置。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:196, type:'judge', text:'不仅需要报警，也需要联动，一定是集中报警系统。（错）', options:['对','错'], answer:1, explanation:'控制中心报警系统也可报警及联动。' },
        { id:197, type:'judge', text:'采用减光率为0.4dB的减光片遮挡光路并尽可能靠近线型光束感烟火灾探测器的接收器，线型光束感烟火灾探测器不应发出火灾报警信号。（对）', options:['对','错'], answer:0, explanation:'表述正确。' },
        { id:198, type:'judge', text:'建筑物火灾中，若火风压大于进风口的压力，则烟火便全部从内部蔓延，当它进入楼梯间、电梯井等竖井后，会大大增强烟囱效应。（错）', options:['对','错'], answer:1, explanation:'若火风压大于进风口压力，烟火扩散出室外向上蔓延。' },
        { id:199, type:'judge', text:'按照火灾分类标准，我国火灾分为特别重大火灾、重大火灾和较大火灾。（错）', options:['对','错'], answer:1, explanation:'我国火灾分为特别重大火灾、重大火灾、较大火灾和一般火灾。' },
        { id:200, type:'judge', text:'接到火灾报警后，消防控制室值班人员应立即向单位领导报告。（错）', options:['对','错'], answer:1, explanation:'应先以最快方式确认，确认后再报告并拨打119。' }
      ]
    },
    {
      id: 'paper2',
      name: '中级监控精准题库02',
      description: '单选题 77 题 · 多选题 37 题 · 判断题 41 题',
      questions: [
        { id:1, type:'single', text:'消防电话插孔保养时，下列部件中需要予以更换的是（B）？', options:['螺钉松动','端子垫片锈蚀','盖板脱落','插孔积灰'], answer:1, explanation:'用旋具紧固松动的接线端子，接线端烫锡接牢。换掉有锈蚀痕迹的螺钉、端子垫片等接线部件。' },
        { id:2, type:'single', text:'火灾报警控制器／消防联动控制器按下"查询"键后，可选择（C）功能来判别现场消防设备的工作状态？', options:['历史信息查询','设备历史信息查询','设备信息查询','设备操作信息查询'], answer:2, explanation:'按下火灾报警控制器／消防联动控制器操作面板上的"查询"键，通过数字键或上下方向键选择"设备信息查询"功能，进入设备信息查询界面后选择"设备状态查询"并按下"确认"键。' },
        { id:3, type:'single', text:'手动停止排烟风机时，应先将排烟风机电气控制柜置于（B）运行模式，再按下（）按钮，使排烟风机停止运行？', options:['手动，启动','手动，停止','自动，启动','自动，停止'], answer:1, explanation:'手动停止排烟风机：先将排烟风机电气控制柜置于"手动"运行模式，再按下停止按钮使风机停止运行。' },
        { id:4, type:'single', text:'当室内通风不良、燃烧处于缺氧状态时，由于氧气的引入导致热烟气发生的爆炸性或快速的燃烧现象，称为（C）？', options:['闪燃','自燃','回燃','爆炸'], answer:2, explanation:'当室内通风不良、燃烧处于缺氧状态时，由于氧气的引入导致热烟气发生的爆炸性或快速的燃烧现象，称为回燃。' },
        { id:5, type:'single', text:'关于可燃气体报警系统下列说法正确的是（B）？', options:['可燃气体报警控制器必须具有低限、高限两段报警','可燃气体报警系统具有屏蔽状态','可燃气体报警控制器高限报警时，故障报警指示灯亮','可燃气体报警系统处于多种报警并存状态时，可燃气体报警控制器发出的是故障报警声'], answer:1, explanation:'可燃气体报警系统具有屏蔽状态。' },
        { id:6, type:'single', text:'消防安全重点单位微型消防站接到火情信息后，消防员应按照（B）分钟到场的要求赶赴现场处置？', options:['1','3','5','7'], answer:1, explanation:'消防员应按照3min到场的要求赶赴现场处置。' },
        { id:7, type:'single', text:'在空气中极易燃烧，火灾危险性大的建筑材料属于（C）？', options:['不燃材料','难燃材料','易燃材料','可燃材料'], answer:2, explanation:'易燃材料（制品）极易燃烧，火灾危险性大。' },
        { id:8, type:'single', text:'火灾探测器及其他火灾报警触发器件触发后，集中火灾报警控制器能直接或间接地接收来自火灾探测器及其他火灾报警触发器件的（A）发出火灾报警声、光信号，指示火灾发生部位记录火灾报警时间，并予以保持，直至手动复位？', options:['火灾报警信号','设施启动信号','联动控制信号','监管控制信号'], answer:0, explanation:'集中火灾报警控制器能直接或间接地接收来自火灾探测器及其他火灾报警触发器件的火灾报警信号。' },
        { id:9, type:'single', text:'下列哪项不属于线型光束感烟火灾探测器底座的保养检查内容（D）？', options:['与墙体安装是否稳定','接线端子是否松动','接线是否有锈蚀','是否有划痕'], answer:3, explanation:'检查线型光束感烟火灾探测器底座或线型感温火灾探测器终端盒外壳与墙体安装是否稳定，接线端子是否松动，接线是否有锈蚀。' },
        { id:10, type:'single', text:'一类高层建筑及建筑高度大于32m的二类高层建筑应设置（B）？', options:['封闭楼梯间','防烟楼梯间','室外疏散楼梯','敞开楼梯间'], answer:1, explanation:'一类高层建筑及建筑高度大于32m的二类高层建筑，其疏散楼梯均应设置为防烟楼梯间。' },
        { id:11, type:'single', text:'由外部引火源作用于可燃物引起燃烧的现象，称为（A）？', options:['引燃','阴燃','自燃','爆炸'], answer:0, explanation:'由外部引火源作用于可燃物引起燃烧的现象，称为引燃。' },
        { id:12, type:'single', text:'手动开启板式排烟口时，先找到板式排烟口的远程执行机构，向开启方向拨动（D）即可打开板式排烟口？', options:['"复位1"螺杆','"复位2"螺杆','复位按钮','火警开关'], answer:3, explanation:'向开启方向拨动执行机构火警开关，查看板式排烟口是否打开。' },
        { id:13, type:'single', text:'下列组件属于集中报警系统，但不属于区域报警系统的是（D）？', options:['火灾探测器','火灾声光警报器','手动火灾报警按钮','消防联动控制器'], answer:3, explanation:'区域报警系统应由火灾探测器、手动火灾报警按钮、火灾声光警报器及火灾报警控制器等组成；集中报警系统应由火灾探测器、手动火灾报警按钮、火灾声光警报器、消防专用电话、消防应急广播、消防控制室图形显示装置、火灾报警控制器、消防联动控制器等组成。' },
        { id:14, type:'single', text:'排烟风机应能满足在（D）高温环境连续工作30min的要求？', options:['68℃','70℃','150℃','280℃'], answer:3, explanation:'排烟风机应能满足在280℃高温环境中连续工作30min的要求。' },
        { id:15, type:'single', text:'（A）是以通过火灾早期探测和报警，向各类消防设施发出控制信号并接收设备反馈信号，进而实现预定消防功能为基本任务的一种自动消防设施？', options:['火灾自动报警系统','自动喷水灭火系统','气体灭火系统','泡沫灭火系统'], answer:0, explanation:'火灾自动报警系统是以通过火灾早期探测和报警，向各类消防设施发出控制信号并接收设备反馈信号，进而实现预定消防功能为基本任务的一种自动消防设施。' },
        { id:16, type:'single', text:'每个防火分区应至少设置（A）只手动报警按钮？', options:['一','二','三','四'], answer:0, explanation:'每个防火分区应至少设置一只手动火灾报警按钮。' },
        { id:17, type:'single', text:'阴燃是（A）的燃烧特点？', options:['可燃固体','可燃液体','可燃气体','液体混合物'], answer:0, explanation:'阴燃是可燃固体的燃烧特点。' },
        { id:18, type:'single', text:'打开湿式报警阀警铃试验阀时，水力警铃应在（A）s内发出报警铃声？', options:['5～90s','15～60s','10～90s','15～90s'], answer:0, explanation:'水力警铃应在5～90s内发出报警铃声。' },
        { id:19, type:'single', text:'下列说法中错误的是（C）？', options:['集中报警系统应设置消防控制室','控制中心报警系统应至少设置一个主消防控制室','控制中心报警系统各分控制室内消防设备之间可以互相传输信息、相互控制','集中报警系统中起到集中控制作用的消防设备，都应设置在消防控制室内'], answer:2, explanation:'控制中心报警系统各分控制室内消防设备之间不可以互相传输信息、相互控制。' },
        { id:20, type:'single', text:'雨淋系统主要由（A）雨淋报警阀组、管道及供水设施等组成？', options:['开式喷头','闭式喷头','玻璃球喷头','水流喷头'], answer:0, explanation:'雨淋系统主要由开式喷头、雨淋报警阀组、管道及供水设施等组成。' },
        { id:21, type:'single', text:'通过观察相互连接的火灾报警控制器之间的（C）关系（系统兼容功能），可区分集中火灾报警控制器和区域火灾报警控制器？', options:['自动','被动','主从','联动'], answer:2, explanation:'通过观察相互连接的火灾报警控制器之间的主从关系（系统兼容功能）情况可区分集中控制器和区域控制器。' },
        { id:22, type:'single', text:'测试消防应急广播的声压级应在距扬声器（D）3m处？', options:['后方','左侧方','右侧方','正前方'], answer:3, explanation:'测试消防应急广播的声压级应在距扬声器正前方3m处。' },
        { id:23, type:'single', text:'标准Windows键盘采用（B）个键？', options:['103','104','105','106'], answer:1, explanation:'标准Windows键盘共有104个键。' },
        { id:24, type:'single', text:'我国消防工作是一项由政府统一领导、部门依法监管、单位全面负责、公民积极参与、专业队伍与社会各方面协同、群防群治地预防和减少火灾危害，开展应急救援的公共消防安全的（C）工作？', options:['专业性','特殊性','专门性','独立性'], answer:2, explanation:'我国消防工作是一项公共消防安全的专门性工作。' },
        { id:25, type:'single', text:'建筑物中经常有人停留或可燃物较多且无可开启外窗的房间，当总建筑面积大于（B）㎡或一个房间建筑面积大于50㎡，应设置排烟设施？', options:['100','200','300','400'], answer:1, explanation:'房间的建筑面积不大于50m2，总建筑面积大于200m2的区域应设置排烟设施。' },
        { id:26, type:'single', text:'消防电话系统保养后，系统功能接入复检不包括（A）？', options:['声、光报警功能','通话功能','显示功能','录音功能'], answer:0, explanation:'系统功能接入复检包含通话功能、显示功能、录音功能。' },
        { id:27, type:'single', text:'自动喷水灭火系统的洒水喷头按照不同的分类方式可分为不同的种类，下列不属于按照喷头安装方式分类的是（A）？', options:['玻璃球洒水喷头','下垂型洒水喷头','直立型洒水喷头','边墙型洒水喷头'], answer:0, explanation:'洒水喷头按照喷头安装方式可分为：通用型喷头、直立型喷头、下垂型喷头、边墙型喷头。' },
        { id:28, type:'single', text:'厂房的火灾危险性根据其生产中使用或产生的物质的性质及其数量等因素，划分为（B）类？', options:['4','5','6','8'], answer:1, explanation:'厂房的火灾危险性划分为甲、乙、丙、丁、戊类，共5类。' },
        { id:29, type:'single', text:'送风口、排烟口、排烟防火阀、挡烟垂壁的保养周期为（C）保养一次？', options:['每月','每季度','每半年','每年'], answer:2, explanation:'送风口、排烟口、排烟防火阀、挡烟垂壁每半年保养一次。' },
        { id:30, type:'single', text:'火灾扑灭后，故意破坏或伪造现场，尚不构成犯罪的，情节较轻的，处警告或（C）元以下罚款？', options:['二百','三百','五百','一千'], answer:2, explanation:'处警告或500元以下罚款。' },
        { id:31, type:'single', text:'机械加压送风系统应当与火灾自动报警系统联动，当某一防火分区内火灾确认后，机械加压送风系统应能在（B）内联动开启该防火分区全部楼梯间的加压送风机？', options:['5s','15s','30s','60s'], answer:1, explanation:'机械加压送风系统应能在15s内联动同时开启该防火分区的全部疏散楼梯间、该防火分区所在着火层及其相邻上下各一层疏散楼梯间及其前室或合用前室的加压送风机。' },
        { id:32, type:'single', text:'在供电电网经常发生断电的地区，计算机必须配置不间断电源，它的英文缩写是（A）？', options:['UPS','WPS','LCD','CFR'], answer:0, explanation:'UPS是不间断电源的英文缩写。' },
        { id:33, type:'single', text:'消防应急灯具按照（A）分为消防应急照明灯具、消防应急标志灯具、消防应急照明标志复合灯具？', options:['用途','应急控制方式','工作方式','应急供电方式'], answer:0, explanation:'消防应急灯具按照用途分为消防应急照明灯具、消防应急标志灯具、消防应急照明标志复合灯具。' },
        { id:34, type:'single', text:'扑救C类火灾应选用（C）？', options:['水系灭火剂','自行熄灭','干粉灭火剂','化学泡沫灭火剂'], answer:2, explanation:'扑救C类火灾应选用干粉、二氧化碳等灭火剂。' },
        { id:35, type:'single', text:'区分集中火灾报警控制器的信号类型时，触发火灾报警触发器件发出火灾报警信号，使集中火灾报警控制器处于（A）？', options:['火警状态','启动状态','自检状态','联动状态'], answer:0, explanation:'使集中火灾报警控制器处于火警状态。' },
        { id:36, type:'single', text:'建（构）筑物火灾发生过程中，（A）阶段是灭火的最佳时机？', options:['初起','成长发展','猛烈燃烧','衰减熄灭'], answer:0, explanation:'在初起阶段是灭火的最佳时机。' },
        { id:37, type:'single', text:'某场所设置有两个消防控制室，在选择火灾自动报警系统形式时，应采用（C）？', options:['区域报警系统','集中报警系统','控制中心报警系统','消防联动控制系统'], answer:2, explanation:'控制中心报警系统适用于设置两个及以上消防控制室的保护对象。' },
        { id:38, type:'single', text:'燃烧过程的发生和发展必须同时具备可燃物、助燃物、（A）三个必要条件，通常称为"燃烧三要素"？', options:['引火源','氧化剂','无机物','链式反应'], answer:0, explanation:'燃烧三要素：可燃物、助燃物、引火源。' },
        { id:39, type:'single', text:'建筑沿外墙的每个防火分区在对应消防救援操作面范围内设置的消防救援口不应少于（B）个？', options:['3','2','1','根据计算确定'], answer:1, explanation:'不应少于2个。' },
        { id:40, type:'single', text:'对电气火灾监控器接线保养方法不正确的是（D）？', options:['检查接线端子有无松动现象，发现松动应用螺丝刀紧固，确保连接紧密','检查线路接头处有无锈蚀或者氧化痕迹，如有应采取防潮、防锈措施','发现螺栓、垫片及配件有生锈现象应及时予以更换','用小毛刷将孔隙内的灰尘和杂质清扫出来，再用吸尘器清理干净'], answer:3, explanation:'用小毛刷将孔隙内的灰尘和杂质清扫出来属于开关、按键保养的方法，不是接线保养。' },
        { id:41, type:'single', text:'非静电力移送单位正电荷从负极到正极的过程中所做的功称为电源的（B）？', options:['电阻','电动势','电压','电功率'], answer:1, explanation:'称为电源的电动势。' },
        { id:42, type:'single', text:'对送风机末端配电装置进行保养前，应使用钥匙打开箱门，切断末端配电装置的（C）？', options:['主电源','备用电源','主、备电源','电源线路'], answer:2, explanation:'切断末端配电装置的主备电源。' },
        { id:43, type:'single', text:'如防火卷帘的温控释放装置未自动动作，还可以通过人工手动拉温控释放装置的手动（A）装置（拉环），使温控释放装置动作，防火卷帘依靠自重下降？', options:['速放','铁链','拉链','按钮盒'], answer:0, explanation:'手动拉动温控释放装置的手动速放装置（拉环）。' },
        { id:44, type:'single', text:'当可燃气体报警控制器液晶显示区域不足以显示全部可燃气体报警部位时，则应按（B）显示，同时应设手动查询按钮（键）？', options:['设备编号单次','报警时间顺序循环','报警时间顺序单次','设备编号循环'], answer:1, explanation:'按报警时间顺序循环显示。' },
        { id:45, type:'single', text:'集中报警系统的控制与显示设备内部电路模板、组件及其接线保养周期至少是每（D）保养一次？', options:['日','周','月','季度'], answer:3, explanation:'每季度保养一次。' },
        { id:46, type:'single', text:'扑救水溶性B类火灾不得选用（D）？', options:['水系灭火剂','干粉灭火剂','气体灭火剂','化学泡沫灭火剂'], answer:3, explanation:'扑救水溶性B类火灾不得选用化学泡沫灭火剂。' },
        { id:47, type:'single', text:'在空气中遇明火或高温作用时难起火、难微燃、难炭化，火源移走后燃烧或微燃停止的材料属于（B）？', options:['不燃材料','难燃材料','易燃材料','可燃材料'], answer:1, explanation:'属于难燃材料。' },
        { id:48, type:'single', text:'火灾显示盘应能接收与其连接的火灾报警控制器发出的火灾报警信号，并在火灾报警控制器发出火灾报警信号后（A）s内发出火灾报警声、光信号，显示火灾发生部位？', options:['3','10','5','7'], answer:0, explanation:'在火灾报警控制器发出火灾报警信号后3s内发出火灾报警声、光信号。' },
        { id:49, type:'single', text:'模拟消防泵组电气控制柜主电源故障时，应确认双电源转换开关处于（B）模式，切断主电源，备用电源自动投入后继续保障正常供电？', options:['手动运行','自动运行','通电运行','正常运行'], answer:1, explanation:'应确认双电源转换开关处于自动运行模式。' },
        { id:50, type:'single', text:'消防泵串联，在流量不变的情况下，可增大（A）？', options:['扬程','轴功率','效率','转速'], answer:0, explanation:'消防泵串联，在流量不变的情况下，可增大扬程。' },
        { id:51, type:'single', text:'风机电气控制柜的手动／自动转换开关处于"手动"位置时，下列说法正确的有（D）？', options:['消防控制室远程手动可控制','不能通过电气控制柜启／停按钮现场控制风机','消防控制室联动控制有效','消防控制室联动控制失效'], answer:3, explanation:'当手动／自动转换开关处于"手动"位置时，风机只能通过风机控制柜启动或停止按钮现场控制，消防控制室远程手动和自动联动控制均失效。' },
        { id:52, type:'single', text:'单位有下列行为之一的，责令改正，处5000元以上5万元以下罚款。（B）？', options:['建设单位要求建筑设计单位或者建筑施工企业降低消防技术标准设计、施工的。','损坏、挪用或者擅自拆除、停用消防设施、器材的。','建筑设计单位不按照消防技术标准强制性要求进行消防设计的。','违反消防安全规定进入生产、储存易燃易爆危险品场所的。'], answer:1, explanation:'损坏、挪用或者擅自拆除、停用消防设施、器材的，处5000元以上5万元以下罚款。' },
        { id:53, type:'single', text:'风机电气控制柜通电时，（B）应点亮？', options:['运行指示灯','电源指示灯','故障指示灯','巡检指示灯'], answer:1, explanation:'电源指示灯，控制柜通电时点亮。' },
        { id:54, type:'single', text:'建筑物之间保持一定的防火间距，主要是考虑预防着火建筑（D）在一定时间内引燃相邻建筑而设置的间隔距离？', options:['热传播','热传导','热对流','热辐射'], answer:3, explanation:'主要是考虑预防着火建筑热辐射在一定时间内引燃相邻建筑。' },
        { id:55, type:'single', text:'下列属于难燃材料的是（D）？', options:['大理石','胶合板','混凝土石膏板','矿棉板'], answer:3, explanation:'矿棉板属于难燃材料。' },
        { id:56, type:'single', text:'机房湿度一般控制在（D）之间？', options:['50~80%','45~75%','30~60%','40~70%'], answer:3, explanation:'计算机机房相对湿度一般控制在40％-70％之间。' },
        { id:57, type:'single', text:'机械排烟系统应当与火灾自动报警系统联动，当火灾发生后，火灾自动报警系统应在（B）内联动开启相应防烟分区的全部排烟阀、排烟口、排烟风机和补风设施？', options:['5s','15s','30s','60s'], answer:1, explanation:'火灾自动报警系统应在15s内联动开启相应防烟分区的全部排烟阀、排烟口、排烟风机和补风设施。' },
        { id:58, type:'single', text:'在空气中遇明火或高温作用时立即起火、微燃或炭化，火源移走后燃烧或微燃仍继续的建筑材料属于（D）？', options:['不燃材料','难燃材料','易燃材料','可燃材料'], answer:3, explanation:'属于可燃材料，其燃烧性能等级为B2。' },
        { id:59, type:'single', text:'泡沫系统由于其保护对象的特性或储罐形式的特殊要求等，有多种分类形式。下列属于按系统形式分类的是（C）？', options:['中倍数泡沫灭火系统','液下喷射系统','全淹没系统','固定式系统'], answer:2, explanation:'按系统形式分为：全淹没系统、局部应用系统、移动系统、泡沫-水喷淋系统、泡沫喷雾系统。' },
        { id:60, type:'single', text:'以下哪个不属于文字处理软件（C）？', options:['WPSOffice','Word','WinRAR','永中Office'], answer:2, explanation:'WinRAR属于压缩软件。' },
        { id:61, type:'single', text:'建筑高度不大于32m的二类高层公共建筑应设置（A）？', options:['封闭楼梯间','防烟楼梯间','敞开楼梯间','室外楼梯'], answer:0, explanation:'建筑高度不大于32m的二类高层公共建筑应设置封闭楼梯间。' },
        { id:62, type:'single', text:'线型感温火灾探测器在发生故障时，应在（C）s内输出故障报警信号，点亮故障指示灯？', options:['30','60','100','120'], answer:2, explanation:'应在100s内输出故障报警信号。' },
        { id:63, type:'single', text:'在可燃易燃液体表面生成凝聚的泡沫漂浮层，可起到（D）和冷却作用？', options:['覆盖','隔离','乳化','窒息'], answer:3, explanation:'可起到窒息和冷却作用。' },
        { id:64, type:'single', text:'通过消防控制室总线手动控制单元远程启动防火卷帘，按下总线手动控制单元防火卷帘启动按钮后，总线手动控制单元的防火卷帘（B）应点亮？', options:['运行灯','启动灯','反馈灯','复位灯'], answer:1, explanation:'观察防火卷帘启动灯是否点亮。' },

        { id:66, type:'single', text:'（C）是指响应悬浮在大气中燃烧和（或）热解产生的固体或液体微粒的探测器？', options:['火焰探测器','感温火灾探测器','感烟火灾探测器','气体火灾探测器'], answer:2, explanation:'感烟火灾探测器是响应悬浮在大气中燃烧和（或）热解产生的固体或液体微粒的探测器。' },
        { id:67, type:'single', text:'建筑高度小于或等于50m的公共建筑、工业建筑和建筑高度小于或等于100m的住宅建筑的房间、走道及中庭等应采用（B）？', options:['自然通风系统','自然排烟系统','机械加压送风系统','机械排烟系统'], answer:1, explanation:'应采用自然排烟系统。' },
        { id:68, type:'single', text:'一般使用（B）在接收器端遮挡光路，测试线型光束感烟探测器的报警功能？', options:['外包装箱','减光片','手套','防尘罩'], answer:1, explanation:'一般使用减光片在接收器端遮挡光路。' },

        { id:70, type:'single', text:'系统在正常监控状态下，手动按下应急照明控制器（C）按钮，应急照明控制器发出手动应急启动信号？', options:['启动','复位','强启','自检'], answer:2, explanation:'手动按下应急照明控制器的"强启"按钮。' },
        { id:71, type:'single', text:'《火灾自动报警系统设计规范》适用于（D）内设置的火灾自动报警系统？', options:['生产火药、炸药的场所','贮存火药、炸药的场所','生产和贮存弹药的场所','工业与民用建筑'], answer:3, explanation:'适用于新建、扩建和改建的建、构筑物中设置的火灾自动报警系统的设计。' },
        { id:72, type:'single', text:'（A）是衡量电场力做功大小的物理量？', options:['电压','电动势','电流','电阻'], answer:0, explanation:'电压又称电势差，是衡量电场力做功大小的物理量。' },
        { id:73, type:'single', text:'（D）不需要设置防烟系统？', options:['楼梯间','消防电梯前室','防烟楼梯间前室','疏散走道'], answer:3, explanation:'疏散走道不需要设置防烟系统。' },
        { id:74, type:'single', text:'电流通过导体会产生热，这种现象称为电流的（A）？', options:['热效应','磁效应','机械效应','电效应'], answer:0, explanation:'电流通过导体会产生热量，这种现象称为电流的热效应。' },

        { id:76, type:'single', text:'以下属于A级材料的是（A）？', options:['金属复合板','矿棉板','胶合板','水泥刨花板'], answer:0, explanation:'金属复合板属于A级材料。' },
        { id:77, type:'single', text:'电气火灾监控器在接收到（A）的报警信息，经报警确认判断，将驱动安装在保护区域现场的声光警报装置发出声光警报？', options:['电气火灾监控探测器','火灾报警控制器','消防联动控制器','图形显示装置'], answer:0, explanation:'电气火灾监控器在接收到电气火灾监控探测器的报警信息，经报警确认判断，将驱动声光警报装置发出声光警报。' },
        { id:78, type:'multiple', text:'下列关于老年人照料设施平面布置的说法，正确的是（ABCDE）？', options:['对于一、二级耐火等级建筑，不应布置在楼地面设计标高大于54m的楼层上','对于三级耐火等级建筑，应布置在首层或二层','老年人公共活动用房、康复与医疗用房，应布置在地下一层及以上楼层，当布置在半地下或地下一层、地上四层及以上楼层时，每个房间的建筑面积不应大于200m2且使用人数不应大于30人','居室和休息室不应布置在地下或半地下','老年人照料设施应采用防火门、防火窗、耐火极限不低于2.00h的防火隔墙和耐火极限不低于1.00h的楼板与其他区域分隔'], answer:[0,1,2,3,4], explanation:'以上说法均正确。' },
        { id:79, type:'multiple', text:'火场发生回燃前有哪些征兆（BCDE）？', options:['空中烟气降至地面1m左右','开口流出脉动式热烟气','有烟气被倒吸入室内的现象','热烟气层中出现蓝色火焰','听见吸气声或呼啸声'], answer:[1,2,3,4], explanation:'回燃发生前征兆：开口流出脉动式热烟气；有烟气被倒吸入室内的现象；热烟气层中出现蓝色火焰；听见吸气声或呼啸声。' },
        { id:80, type:'multiple', text:'下列（ACDE）部位应设置排烟防火阀？', options:['垂直主排烟管道与每层水平排烟管道交接处的水平管段','垂直主排烟管道与每层水平排烟管道交接处的垂直管段','负担多个防烟分区的排烟支管处','排烟风机入口处','排烟管道穿越防火分区处'], answer:[0,2,3,4], explanation:'机械排烟系统的垂直主排烟管道与每层水平排烟管道交接处的水平管段、负担多个防烟分区的排烟支管处、排烟风机入口处、排烟管道穿越防火分区处均应设置排烟防火阀。' },
        { id:81, type:'multiple', text:'在起火的建筑物内，火由起火房间转移到其他房间再蔓延到相邻建筑的过程，主要是靠（ABCD）方式实现的？', options:['可燃构件的直接燃烧','热传导','热辐射','热对流','火灾蔓延'], answer:[0,1,2,3], explanation:'主要是靠可燃构件的直接燃烧、热传导、热辐射和热对流的方式实现的。' },
        { id:82, type:'multiple', text:'消防应急广播系统主要由（ABCDE）及扬声器等组成？', options:['消防应急广播主机','分配盘','功放机','输出模块','音频线路'], answer:[0,1,2,3,4], explanation:'消防应急广播系统主要由消防应急广播主机、功放机、分配盘、输出模块、音频线路及扬声器等组成。' },
        { id:83, type:'multiple', text:'《消防法》包括的内容有（ABCDE）？', options:['火灾预防','消防组织','灭火救援','监督检查','法律责任'], answer:[0,1,2,3,4], explanation:'《消防法》全文分为总则、火灾预防、消防组织、灭火救援、监督检查、法律责任和附则。' },
        { id:84, type:'multiple', text:'计算机的安全工作环境包括（ABCDEF）等方面？', options:['温度','湿度','电源','灰尘','震动和噪音','静电'], answer:[0,1,2,3,4,5], explanation:'计算机的安全工作环境需要满足温度、湿度、电源、灰尘、震动和噪声、静电等方面的要求。' },
        { id:85, type:'multiple', text:'对应急广播设备外观进行保养，应使用吸尘器、清洁的干软布等清除（ABC）的灰尘？', options:['主机外壳','扬声器表面','接线端子','主机电源','主机内部线路板'], answer:[0,1,2], explanation:'清除主机外壳和扬声器表面及所有接线端子处的灰尘。' },
        { id:86, type:'multiple', text:'初起火灾扑救的基本原则是（ABC）？', options:['救人第一','先控制，后消灭','先重点，后一般','第一时间扑救','迅速抢救财物'], answer:[0,1,2], explanation:'初起火灾扑救的基本原则：救人第一，先控制、后灭火，先重点、后一般。' },
        { id:87, type:'multiple', text:'（ABCDE）容易导致变压器发生火灾？', options:['变压器产品制造质量不良、检修失当、长期过负荷运行等','线圈间、线圈与分接头间接线处连接不好造成局部接触电阻过大','铁芯绝缘损坏后，涡流加大，温度升高','当变压器冷却油油质劣化后，雷击或操作过电压会使油中产生电弧闪络','用电设备过负荷、故障短路、外力使瓷瓶损坏'], answer:[0,1,2,3,4], explanation:'以上均容易导致变压器发生火灾。' },
        { id:88, type:'multiple', text:'中倍泡沫灭火剂一般用于扑灭（BDE）？', options:['可燃气体','易燃可燃液体','电气设备火灾','固体表面火灾','固体深位阴燃火灾'], answer:[1,3,4], explanation:'中倍泡沫灭火剂一般用于控制或扑灭可燃液体、固体表面火灾及固体深位阴燃火灾。' },
        { id:89, type:'multiple', text:'集中报警系统的控制与显示类设备内部吹扫主要包含各种（ABCDE）？', options:['电路模板','组件','电池','接线端子','线材'], answer:[0,1,2,3,4], explanation:'吹扫设备内部的各种电路模板、组件电池、接线端子、线材。' },
        { id:90, type:'multiple', text:'集中报警系统中的火灾报警控制器、消防联动控制器和消防联动控制设备具有（AB）控制状态？', options:['手动','自动','联动','联锁','火警'], answer:[0,1], explanation:'具有手动、自动两种控制状态。' },
